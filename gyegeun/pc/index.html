<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계근 대장 · 본에코</title>
<style>
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --card2:#F5F7FA; --line:#D8DEE7; --line2:#E8EDF2;
  --tx:#1B222C; --dim:#6B7683; --acc:#A0631A; --accbg:#FFF5E4;
  --ok:#2E8B57; --bad:#C8402F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

header{
  border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:18px;
  position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:10;flex-wrap:wrap
}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
header h1 span{color:var(--acc)}
.sp{flex:1}
.st{font-size:13px;color:var(--dim)}

.wrap{max-width:1680px;margin:0 auto;padding:22px 24px 40px}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
@media (max-width:1180px){ .cols{grid-template-columns:minmax(0,1fr)} }
.colR{position:sticky;top:70px}
.listbox{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.scrollbox{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:auto}
.scrollbox table{border:none;border-radius:0}
.scrollbox th{position:sticky;top:0;z-index:2}
.scrollbox tfoot td{position:sticky;bottom:0;z-index:2;box-shadow:0 -1px 0 var(--line)}
.scrollbox .empty{padding:30px 20px}
#vehBox{max-height:calc(46vh - 60px)}
#dateBox{max-height:calc(46vh - 60px)}
.colL{position:sticky;top:70px}
.listwrap{max-height:calc(100vh - 200px);overflow:auto}
.listwrap table{border:none;border-radius:0}
.listwrap th{position:sticky;top:0;z-index:2}
.colhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.colhead h2{margin:0;font-size:14px}
.colhead .n{font-size:12.5px;color:var(--dim);margin-left:auto}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:20px;
  position:sticky;top:var(--hdr,58px);z-index:9;background:var(--bg);
  padding:10px 0 12px;box-shadow:0 10px 10px -10px rgba(0,0,0,.10)}
@media(max-width:900px){.bar{position:static;box-shadow:none;padding:0}}
button,input,select{font-family:inherit;font-size:14px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 15px;border-radius:9px;font-weight:600;cursor:pointer}
.chip.sel{background:var(--tx);border-color:var(--tx);color:#fff}
.chip.sm{padding:5px 11px;font-size:12.5px;font-weight:600}
.chip:not(.sel):hover{border-color:var(--acc);color:var(--acc)}
input[type=month],input[type=date],select{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:9px;outline:none}
input[type=month]:focus,select:focus{border-color:var(--acc)}
.go{background:var(--acc);border:1px solid var(--acc);color:#fff;padding:9px 17px;border-radius:9px;font-weight:700;cursor:pointer}
.srch{position:relative}
.srch input{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 12px 9px 32px;
  border-radius:9px;outline:none;width:180px;font-size:14px}
.srch input:focus{border-color:var(--acc);width:220px}
.srch::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:17px}
.go:hover{background:#8A5415}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.c .k{font-size:13px;color:var(--dim);font-weight:600}
.c .v{font-size:25px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.c .s{font-size:12px;color:var(--dim);margin-top:2px}
.c.tot{background:var(--accbg);border-color:rgba(160,99,26,.3)}
.c.tot .v{color:var(--acc)}

h2{font-size:14px;color:var(--dim);font-weight:700;margin:26px 0 10px}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{font-size:12.5px;color:var(--dim);font-weight:700;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);font-size:14px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--card2)}
.r{text-align:right}
.r.b{font-weight:700}
tfoot td{background:var(--card2);font-weight:800;border-top:1px solid var(--line)}
.veh{color:var(--acc);font-weight:700}

.mini{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;margin-right:5px}
.mini:hover{color:var(--tx);border-color:var(--acc)}
.mini.x:hover{color:var(--bad);border-color:var(--bad)}
.mini.pic{color:var(--acc);border-color:rgba(160,99,26,.35);background:var(--accbg);font-weight:600}
.picgone{font-size:12px;color:var(--dim);border:1px dashed var(--bd);border-radius:6px;padding:2px 7px;white-space:nowrap;cursor:help}

/* ---------- 일괄 입력 ---------- */
.entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:22px;display:none}
.entry.on{display:block}
.erow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.ef{display:flex;flex-direction:column;gap:5px}
.ef label{font-size:12px;color:var(--dim);font-weight:700}
.ef input[type=date],.ef select{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:9px;outline:none;min-width:130px}
.ef input:focus,.ef select:focus{border-color:var(--acc)}
.etext{width:100%;min-height:150px;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-family:'Consolas','D2Coding',monospace;font-size:17px;line-height:1.7;
  color:var(--tx);outline:none;resize:vertical;font-variant-numeric:tabular-nums}
.etext:focus{border-color:var(--acc)}
.efoot{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.epv{font-size:14px;color:var(--dim)}
.epv b{color:var(--tx);font-size:16px}
.ehint{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.7}
/* ---------- 수정 창 ---------- */
.modal{position:fixed;inset:0;background:rgba(24,28,34,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(460px,100%);box-shadow:0 12px 40px rgba(0,0,0,.22)}
.mbox h3{margin:0 0 4px;font-size:17px;font-weight:800}
.mbox .sub{font-size:12.5px;color:var(--dim);margin-bottom:18px}
.mf{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.mf label{font-size:12px;color:var(--dim);font-weight:700}
.mf input,.mf select{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:10px 12px;border-radius:9px;outline:none;font-size:15px;width:100%}
.mf input:focus,.mf select:focus{border-color:var(--acc)}
.mf input.w{font-size:22px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.empty{text-align:center;color:var(--dim);padding:60px 20px}
/* 엑셀 양식에 자리가 없는 전표 경고 */
/* 사진과 다른 전표 표시 */
tr.bad{background:#FFF6F5}
tr.bad td{border-color:#F2D6D2;border-bottom:0}
tr.why td{background:#FFF6F5;border-color:#F2D6D2;padding:0 14px 11px;font-size:13px;color:#A32E22}
tr.why .rs{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
tr.why b{font-weight:800}
.tm{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:1px}
/* 골라서 지우기 */
.pickbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FBEAE8;border:1px solid #E4B4AE;
  border-radius:12px;padding:13px 16px;margin-bottom:18px}
.pickbar .n{font-weight:800;color:#A32E22;font-size:14.5px}
.pickbar .sp{flex:1}
.delbtn{background:#C0392B;border:1px solid #C0392B;color:#fff;border-radius:9px;padding:9px 16px;
  font-size:14px;font-weight:800;cursor:pointer}
.delbtn:disabled{opacity:.45;cursor:default}
td.pk{width:34px;text-align:center}
td.pk input{width:17px;height:17px;cursor:pointer}
tr.picked{background:#FBEAE8}
.okbtn{background:#2F7A4F;border:1px solid #2F7A4F;color:#fff;border-radius:7px;
  padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.ver{font-size:12px;font-weight:700;color:var(--dim);background:var(--card2);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;vertical-align:3px}
.mini.warn{background:#C0392B;border-color:#C0392B;color:#fff;font-weight:800}
.flag{display:inline-block;background:#FBEAE8;border:1px solid #E4B4AE;color:#A32E22;
  border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:800;margin-left:6px;vertical-align:1px}
.chkbar{display:flex;align-items:center;gap:12px;background:#FFF8E9;border:1px solid #E7D3A8;
  border-radius:11px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:#7A5A16}
.chkbar .bar{flex:1;height:7px;background:#EADDBE;border-radius:4px;overflow:hidden}
.chkbar .bar i{display:block;height:100%;background:#A0631A;width:0}
.xw{background:#FBEAE8;border:1px solid #E4B4AE;border-radius:12px;padding:16px 18px;margin-bottom:20px}
.xw h3{margin:0 0 6px;font-size:16px;color:#A32E22}
.xw p{margin:0 0 12px;font-size:13.5px;color:#8A4238;line-height:1.6}
.xw table{background:#fff;border-color:#E4B4AE}
.xw th{background:#F8DDD9;color:#8A4238;border-color:#E4B4AE}
.xw td{border-color:#F0D2CD}
.period{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 18px;padding:10px 14px;
  border:1px solid #C7D8EC;background:#EEF4FB;border-radius:11px;font-size:13.5px;color:#2C5A8A}
.period b{font-size:15px;color:#1B3F63}
.period .x{margin-left:auto}
/* 차량 × 일자 */
#gridBox{max-height:60vh;margin-bottom:26px}
#byGrid table{font-size:12.5px;white-space:nowrap}
#byGrid th,#byGrid td{padding:6px 9px}
#byGrid thead th{position:sticky;top:0;z-index:3}
#byGrid .vh{position:sticky;left:0;z-index:2;background:var(--card);font-weight:700;
  box-shadow:1px 0 0 var(--line);cursor:pointer}
#byGrid thead .vh{z-index:4;background:var(--card2)}
#byGrid tfoot .vh{z-index:4;background:var(--card2)}
#byGrid tfoot td{position:sticky;bottom:0;z-index:2;background:var(--card2);box-shadow:0 -1px 0 var(--line)}
#byGrid td.d{cursor:pointer}
#byGrid td.d:hover{background:var(--accbg)}
#byGrid td.on{background:var(--acc);color:#fff;font-weight:800}
#byGrid tfoot td.gap{color:#C8402F;font-weight:700;background:#FDF2F0}
#byGrid td.z{color:var(--dim)}
#byGrid .sun{color:#C8402F}
.msg{padding:14px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);margin-bottom:18px;font-size:14px}
.msg.err{border-color:rgba(200,64,47,.4);background:#FDF2F0;color:var(--bad)}

/* ---------- 사진 뷰어 ---------- */
.viewer{position:fixed;inset:0;background:rgba(24,28,34,.92);z-index:60;display:none;flex-direction:column}
.viewer.on{display:flex}
.vtop{
  display:flex;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap;
  background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)
}
.vtop .cap{font-size:13.5px;color:var(--dim);margin-right:auto}
.vb{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.vb:hover{border-color:var(--acc);color:var(--acc)}
.vb.close{background:var(--tx);border-color:var(--tx);color:#fff}
.vstage{flex:1;overflow:hidden;position:relative;cursor:grab;display:flex;align-items:center;justify-content:center}
.vstage.drag{cursor:grabbing}
.vstage img{
  max-width:none;transform-origin:center center;user-select:none;-webkit-user-drag:none;
  transition:transform .12s ease-out;box-shadow:0 6px 30px rgba(0,0,0,.4);background:#fff
}
.vhint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:rgba(255,255,255,.6);font-size:12.5px;pointer-events:none}

.toast{position:fixed;right:24px;bottom:24px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 18px;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s;z-index:70;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.toast.on{opacity:1;transform:none}
.toast.good{border-color:rgba(46,139,87,.5);color:var(--ok)}
.toast.err{border-color:rgba(200,64,47,.5);color:var(--bad)}
</style>
</head>
<body>

<header>
  <h1>계근 대장 <span>·</span> 본에코 <span class="ver">v55</span></h1>
  <div class="sp"></div>
  <div class="st" id="st">불러오는 중</div>
  <button class="chip" id="bReload">새로고침</button>
</header>

<div class="wrap">
  <div class="bar">
    <button class="chip" data-q="today">오늘</button>
    <button class="chip" data-q="7">최근 7일</button>
    <button class="chip sel" data-q="month">이번 달</button>
    <input type="month" id="fMonth">
    <input type="date" id="fDay" title="이 날짜부터">
    <span id="dayTil" style="color:var(--dim);font-weight:700">~</span>
    <input type="date" id="fDay2" title="이 날짜까지 — 비우면 하루만">
    <button class="chip" id="bDayClear" style="display:none">날짜 해제</button>
    <select id="fVeh"><option value="">전체 차량</option></select>
    <select id="fSeong"><option value="">전체 성상</option></select>
    <select id="fJo"><option value="">전체 조</option><option>주간</option><option>야간</option></select>
    <div class="sp"></div>
    <span class="srch"><input type="search" id="fQ" placeholder="차량번호 검색" autocomplete="off"></span>
    <button class="chip" id="bChk">사진 대조</button>
    <button class="chip" id="bPick">골라서 지우기</button>
    <button class="chip" id="bOnlyBad" style="display:none">확인 필요만 보기</button>
    <button class="chip" id="bOkAll" style="display:none">지금 보이는 것 전부 확인함</button>
    <button class="chip" id="bPicDl">사진 내려받기</button>
    <button class="chip" id="bPicPurge">사진 지우기</button>
    <button class="chip" id="bTrash">휴지통</button>
    <button class="chip" id="bToggle">전표 직접 입력</button>
    <button class="go" id="bCsv">대장 CSV 내려받기</button>
  </div>

  <div class="entry" id="entry">
    <div class="erow">
      <div class="ef"><label>계근일</label><input type="date" id="eDate"></div>
      <div class="ef"><label>차량</label><select id="eVeh"></select></div>
      <div class="ef"><label>성상</label><select id="eSeong"></select></div>
      <div class="ef"><label>반입처</label><select id="eSite"></select></div>
    </div>
    <label style="font-size:12px;color:var(--dim);font-weight:700">실중량 — 한 줄에 한 장씩</label>
    <textarea class="etext" id="eText" placeholder="5530&#10;5390&#10;5600" spellcheck="false"></textarea>
    <div class="ehint">전표 보면서 숫자만 치고 Enter. 쉼표는 있어도 되고 없어도 됩니다. 빈 줄은 무시합니다.</div>
    <div class="efoot">
      <span class="epv" id="ePv">전표 <b>0</b>장 · 합계 <b>0</b> kg</span>
      <div class="sp" style="flex:1"></div>
      <button class="chip" id="eClear">지우기</button>
      <button class="go" id="eSave">저장</button>
    </div>
  </div>

  <div id="period"></div>
  <div id="msg"></div>
  <div id="trash"></div>
  <div id="xlwarn"></div>
  <div id="picbar"></div>
  <div id="pickbar"></div>
  <div id="chkbar"></div>

  <h2 id="gridH" style="margin:2px 0 10px">차량별 일자 <span style="font-weight:400;font-size:12.5px;color:var(--dim)">— 칸을 누르면 그 차량·그 날짜 전표만 보입니다. 바닥줄이 빨간 「없음」인 날은 전표가 한 장도 없는 날입니다.</span></h2>
  <div class="scrollbox" id="gridBox"><div id="byGrid"></div></div>

  <div class="cols">
    <div class="colL">
      <div class="cards" id="cards"></div>
      <h2 style="margin-top:4px">근무조별</h2>
      <div id="byJo"></div>
      <h2>차량별</h2>
      <div class="scrollbox" id="vehBox"><div id="byVeh"></div></div>
      <h2>일자별</h2>
      <div class="scrollbox" id="dateBox"><div id="byDate"></div></div>
    </div>

    <div class="colR">
      <div id="focusbar"></div>
      <div class="listbox">
      <div class="colhead"><h2>전표 목록</h2><span class="n" id="lCnt"></span></div>
        <div class="listwrap" id="list"></div>
      </div>
    </div>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="vtop" id="vTop">
    <span class="cap" id="vCap"></span>
    <button class="vb" data-v="rl">왼쪽으로 회전</button>
    <button class="vb" data-v="rr">오른쪽으로 회전</button>
    <button class="vb" data-v="out">축소</button>
    <button class="vb" data-v="in">확대</button>
    <button class="vb" data-v="fit">원래대로</button>
    <button class="vb close" data-v="x">닫기</button>
  </div>
  <div class="vstage" id="vStage">
    <img id="vImg" alt="전표 사진">
    <div class="vhint">휠로 확대 · 끌어서 이동 · 두 번 누르면 원래대로 · Esc 닫기</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h3>전표 수정</h3>
    <div class="sub" id="mSub"></div>
    <div class="mf"><label>계근일</label><input type="date" id="mDate"></div>
    <div class="mf"><label>차량</label><select id="mVeh"></select></div>
    <div class="mf"><label>성상</label><select id="mSeong"></select></div>
    <div class="mf"><label>반입처</label><select id="mSite"></select></div>
    <div class="mf"><label>실중량 (kg)</label><input type="number" inputmode="numeric" class="w" id="mW"></div>
    <div class="mfoot">
      <button class="chip" id="mCancel">취소</button>
      <button class="go" id="mSave">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB = 'https://minwon-c29c2-default-rtdb.asia-southeast1.firebasedatabase.app';
const SEONG = ['생활','음식물','음식물(다량)','재활용','재활용(다량)','대형','기타'];

/* 월별 계근량 엑셀이 받아 주는 자리 — 차량|성상|반입처.
   여기에 없는 조합으로 저장하면 엑셀 어느 칸에도 안 들어가고 조용히 빠집니다. */
const XL_SLOTS = new Set([

const slotKey = r => `${r.veh}|${r.seong}|${r.site||''}`;

/* 차량·성상별 평소 중량 (이번 달 기준). 자릿수 실수를 잡는 데 씁니다 */
let BAND = {};
function buildBand(rows){
  const g={};
  rows.forEach(r=>{ const k=r.veh+'|'+r.seong; (g[k]=g[k]||[]).push(r.weight); });
  BAND={};
  for(const k in g){
    const a=g[k].slice().sort((x,y)=>x-y);
    if(a.length>=6) BAND[k]={n:a.length, med:a[a.length>>1]};
  }
}
/* 저장 버튼을 두 번 눌러 같은 전표가 두 번 들어간 것.
   같은 날 같은 무게를 두 번 나르는 건 정상이라, 저장 시각이 붙어 있을 때만 봅니다. */
let DUP = {};
let BWS = {};         // batch -> 그 사진에 딸린 전표들의 실중량
function buildBatch(rows){
  BWS={}; rows.forEach(r=>{ if(r.batch) (BWS[r.batch]=BWS[r.batch]||[]).push(r.weight); });
}
const dupKey = r => `${r.date}|${r.veh}|${r.seong}|${r.site}|${r.weight}`;

function buildDup(rows){
  DUP={};
  rows.forEach(r=>{ (DUP[dupKey(r)]=DUP[dupKey(r)]||[]).push(r.at||0); });
}
function isDoubleSave(r){
  const a=DUP[dupKey(r)]; if(!a || a.length<2 || !r.at) return false;
  // 한 번에 올린 전표들은 저장 시각이 같습니다 — 그건 서로 다른 전표이니 넘어갑니다.
  // 몇 초~몇십 분 뒤에 똑같은 게 또 들어온 것만 '두 번 저장'으로 봅니다.
  return a.some(t=>{ const d=Math.abs(t-r.at); return t && d>2000 && d<30*60*1000; });
}

/* 이 전표가 사진·양식과 어긋나는 점들 */
function flagsOf(r){
  if(okm[r.id]) return [];      // 사람이 보고 맞다고 한 것
  const f=[];
  if(!XL_SLOTS.has(slotKey(r))) f.push('엑셀에 칸 없음');
  // 계근기는 10kg 단위로 찍습니다 — 끝자리가 0이 아니면 손으로 잘못 넣은 것
  if(r.weight % 10) f.push('실중량 끝자리가 0이 아님 — 오타 의심');
  // 자릿수를 빠뜨렸거나 더 넣은 것
  const bd = BAND[r.veh+'|'+r.seong];
  if(bd){
    if(r.weight < bd.med/5) f.push(`평소(${comma(bd.med)}kg)보다 너무 적음 — 자릿수 확인`);
    else if(r.weight > bd.med*5) f.push(`평소(${comma(bd.med)}kg)보다 너무 많음 — 자릿수 확인`);
  }
  if(isDoubleSave(r)) f.push('저장을 두 번 눌러 같은 전표가 두 번 들어감');
  const c = r.batch && chk[r.batch];
  if(c){
    // 읽어낸 숫자는 1차−2차＝실중량 검산을 통과한 것이라 믿을 만합니다.
    // 다만 그 사진의 전표 수보다 적게 읽혔으면 판독이 덜 된 것이니 따지지 않습니다.
    const ws = BWS[r.batch] || [r.weight];
    if(c.w && c.w.length >= ws.length && !c.w.includes(r.weight))
      f.push(`사진 숫자와 다름 (사진: ${c.w.map(comma).join(' · ')})`);
    const pd = plausibleDate(c.ds || (c.d?[c.d]:[]), r.at);   // 전표에 찍힌 날짜 그대로
    if(pd && pd!==r.date)
      f.push(`사진 날짜와 다름 (사진: ${pd.slice(5).replace('-','/')}`
           + (c.t && c.t.length ? ` ${c.t.join('·')}` : '') + ')');
  }
  if(r.at){
    const gap = Math.round((new Date(r.date+'T00:00:00').getTime() - new Date(r.at).setHours(0,0,0,0))/86400000);
    if(gap>1)        f.push(`계근일이 저장일보다 ${gap}일 뒤`);
    else if(gap<-10) f.push(`계근일이 저장일보다 ${-gap}일 전 — 달이 맞는지 확인`);
  }
  return f;
}
function dupSets(rows){
  // 날짜·차량·성상·반입처·실중량이 똑같은 묶음
  const g={};
  rows.forEach(r=>{ const k=dupKey(r); (g[k]=g[k]||[]).push(r); });
  const out=[];
  Object.values(g).filter(a=>a.length>1).forEach(a=>{
    /* 전표번호가 있으면 그것만 봅니다 — 전표 한 장마다 계근기가 매기는 고유 번호입니다. */
    if(a.every(r=>r.no)){
      const bn={};
      a.forEach(r=>{ (bn[r.no]=bn[r.no]||[]).push(r); });
      Object.values(bn).forEach(s=>{ if(s.length>1) out.push(s); });
      return;
    }
    /* 실중량이 같아도 1차·2차 중량이 다르면 서로 다른 전표입니다.
       같은 차가 같은 날 같은 양을 두 번 나르는 일은 실제로 있습니다 — 그건 지우면 안 됩니다. */
    const sub={};
    a.forEach(r=>{ const k=(r.gross&&r.tare)?`${r.gross}|${r.tare}`:'?'; (sub[k]=sub[k]||[]).push(r); });
    const keys=Object.keys(sub);
    if(keys.length===1){ out.push(a); return; }       // 다 같거나, 다 모름
    keys.forEach(k=>{ if(sub[k].length>1) out.push(sub[k]); });
    // 사진으로 한 번, 손으로 또 한 번 넣은 것
    if(sub['?'] && sub['?'].length===1 && keys.length===2){
      const o=keys.find(k=>k!=='?');
      if(sub[o].length===1) out.push([...sub[o], ...sub['?']]);
    }
  });
  return out;
}
function drawPickBar(shown){
  if(!pickMode){ $('#pickbar').innerHTML=''; return; }
  const dup = dupSets(shown).reduce((a,g)=>a+g.length-1, 0);
  const sum = [...pickSet].reduce((a,id)=>{ const r=all.find(x=>x.id===id); return a+(r?r.weight:0); },0);
  $('#pickbar').innerHTML = `<div class="pickbar">
    <span class="n">${pickSet.size ? `${comma(pickSet.size)}건 선택 · ${comma(sum)} kg` : '지울 전표를 체크하세요'}</span>
    <button class="chip" id="pkDup">중복만 자동 선택 (${dup})</button>
    <button class="chip" id="pkAll">보이는 것 전부</button>
    <button class="chip" id="pkNone">선택 해제</button>
    <span class="sp"></span>
    <button class="delbtn" id="pkDel"${pickSet.size?'':' disabled'}>선택한 ${pickSet.size}건 지우기</button>
    <button class="chip" id="pkOff">그만두기</button>
  </div>`;
  const shownIds = shown.map(r=>r.id);
  $('#pkDup').onclick = ()=>{
    /* 묶음마다 1건만 남기고 나머지를 고릅니다.
       남길 것은 "내용이 제일 많은" 건입니다 — 전표번호 > 계근 시각 > 1·2차 중량 순.
       같으면 먼저 저장된 것을 남깁니다. 손으로 넣은 쪽을 남기고
       판독된 쪽을 지우는 일이 없게 하려는 것입니다. */
    const rich = r => (r.no?4:0) + ((r.t1&&r.t2)?2:0) + ((r.gross&&r.tare)?1:0);
    dupSets(shown).forEach(g=>{
      g.slice().sort((a,b)=> rich(b)-rich(a) || (a.at||0)-(b.at||0))
       .slice(1).forEach(r=>pickSet.add(r.id));
    });
    render();
  };
  $('#pkAll').onclick  = ()=>{ shownIds.forEach(id=>pickSet.add(id)); render(); };
  $('#pkNone').onclick = ()=>{ pickSet.clear(); render(); };
  $('#pkOff').onclick  = ()=>{ pickMode=false; pickSet.clear(); render(); };
  $('#pkDel').onclick  = delPicked;
}

async function delPicked(){
  const ids=[...pickSet]; if(!ids.length) return;
  const rows=ids.map(id=>all.find(x=>x.id===id)).filter(Boolean);
  const sum=rows.reduce((a,r)=>a+r.weight,0);
  const days=[...new Set(rows.map(r=>r.date))].sort();
  if(!confirm(`전표 ${comma(ids.length)}건 · ${comma(sum)} kg 을 지웁니다.\n`
            + `해당 날짜: ${days.slice(0,6).join(', ')}${days.length>6?` 외 ${days.length-6}일`:''}\n\n`
            + `휴지통에 남으니 잘못 지우면 되돌릴 수 있습니다. 계속할까요?`)) return;
  const patch={}; ids.forEach(id=>patch[id]=null);
  try{
    await toTrash(rows);                 // 먼저 휴지통에 담고
    const res=await fetch(`${DB}/gyegeun/records.json`,{method:'PATCH',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch)});
    if(!res.ok) throw new Error(res.status);
    // 사진은 지우지 않습니다 — 되살릴 때 같이 돌아와야 하니까요
    all = all.filter(x=>!pickSet.has(x.id));
    pickSet.clear();
    $('#st').textContent=`전표 ${comma(all.length)}건`;
    fillSelects(); render();
    toast(`${comma(ids.length)}건 휴지통으로 보냈습니다`,'good');
  }catch(e){ toast('삭제하지 못했습니다 — 인터넷을 확인하세요','err'); }
}

function allSites(){
  let extra=[];
  try{ extra = JSON.parse(localStorage.getItem('gg_sites')||'[]'); }catch(e){}
  const used = all.map(r=>r.site).filter(Boolean);
  return [...new Set([...SITES, ...extra, ...used])];
}
function addSite(name){
  name=(name||'').trim(); if(!name) return '';
  if(!allSites().includes(name)){
    try{
      const cur=JSON.parse(localStorage.getItem('gg_sites')||'[]');
      cur.push(name); localStorage.setItem('gg_sites',JSON.stringify(cur));
    }catch(e){}
  }
  return name;
}
function siteOptions(sel){
  return allSites().map(x=>`<option${x===sel?' selected':''}>${x}</option>`).join('')
       + `<option value="__new">＋ 직접 입력…</option>`;
}
function siteChange(el){
  if(el.value!=='__new') return;
  const name=addSite(prompt('추가할 반입처 이름을 넣으세요'));
  if(name){ el.innerHTML=siteOptions(name); el.value=name; }
  else el.innerHTML=siteOptions(allSites()[0]);
}

/* ===================== 사진 대조 =====================
   전표 사진을 다시 읽어 저장된 실중량·계근일과 맞는지 봅니다.
   결과는 서버에 남겨 두 PC가 같이 씁니다. */
const OCR_CDN='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker=null, chkStop=false, chkRunning=false;

function loadScript(src){
  return new Promise((ok,no)=>{ const t=document.createElement('script');
    t.src=src; t.onload=ok; t.onerror=()=>no(new Error('load')); document.head.appendChild(t); });
}
async function getOcr(){
  if(ocrWorker) return ocrWorker;
  if(!window.Tesseract) await loadScript(OCR_CDN);
  ocrWorker = await Tesseract.createWorker('eng',1);
  await ocrWorker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
  return ocrWorker;
}
function prep(dataUrl, rot, hard){
  return new Promise(ok=>{
    const img=new Image();
    img.onload=()=>{
      const max=hard?1800:2600, sc=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const turned=rot%180!==0;
      const c=document.createElement('canvas');
      c.width=turned?h:w; c.height=turned?w:h;
      const x=c.getContext('2d');
      x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      x.translate(c.width/2,c.height/2); x.rotate(rot*Math.PI/180);
      x.drawImage(img,-w/2,-h/2,w,h);
      const d=x.getImageData(0,0,c.width,c.height), p=d.data;
      const hist=new Array(256).fill(0);
      for(let i=0;i<p.length;i+=4){
        const g=Math.round(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114); p[i]=g; hist[g]++;
      }
      const total=p.length/4, cut=total*0.02;
      let acc=0, lo=0, hi=255;
      for(let g=0;g<256;g++){ acc+=hist[g]; if(acc>cut){lo=g;break;} }
      acc=0;
      for(let g=255;g>=0;g--){ acc+=hist[g]; if(acc>cut){hi=g;break;} }
      if(hi-lo<30){ lo=0; hi=255; }
      const span=hi-lo;
      for(let i=0;i<p.length;i+=4){
        let v=Math.round((p[i]-lo)*255/span); v=v<0?0:v>255?255:v;
        p[i]=p[i+1]=p[i+2]=v;
      }
      x.putImageData(d,0,0); ok(c);
    };
    img.onerror=()=>ok(null);
    img.src=dataUrl;
  });
}
function ocrTokens(t){
  const out=[]; const re=/\d{1,3}(?:,\d{3})+|\d{2,6}/g; let m;
  while((m=re.exec(t))){
    const v=parseInt(m[0].replace(/,/g,''),10);
    if(v>=10&&v<=99999) out.push({v,comma:m[0].includes(',')});
  }
  return out;
}
function ocrScan(toks,strict){
  const out=[];
  for(let i=0;i+2<toks.length;i++){
    const A=toks[i],B=toks[i+1],C=toks[i+2];
    if(strict&&!(A.comma&&B.comma)) continue;
    // 계근 전표의 1차·2차 중량은 빈 차 무게가 들어 있어 늘 1톤이 넘습니다.
    // 이 문턱이 없으면 잡음 숫자 몇 개가 우연히 A-B=C 를 만족해 '12kg' 같은 게 나옵니다.
    if(Math.abs(A.v-B.v)===C.v && C.v>=50 && A.v>=1000 && B.v>=1000){ out.push(C.v); i+=2; }
  }
  return out;
}
function pickWeights(text){
  const clean=t=>String(t||'').replace(/(\D|^)(\d{1,2}\s*:\s*\d{2}(?:\s*:\s*\d{2})?)(?!\d)/g,'$1 ');
  const norm =t=>String(t||'').replace(/[Oo]/g,'0').replace(/[lI|]/g,'1')
                  .replace(/[Ss]/g,'5').replace(/[Bb]/g,'8').replace(/[Zz]/g,'2');
  for(const t of [clean(text), clean(norm(text))]){
    const all=ocrTokens(t), wc=all.filter(x=>x.comma);
    for(const r of [ocrScan(wc,false), ocrScan(all,true), ocrScan(all,false)])
      if(r.length) return r;
  }
  return [];
}
function pickDates(text){
  const norm=t=>String(t||'').replace(/[Oo]/g,'0').replace(/[lI|]/g,'1')
                 .replace(/[Ss]/g,'5').replace(/[Bb]/g,'8').replace(/[Zz]/g,'2');
  const pats=[/(20\d{2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/g,
              /(?<!\d)(20\d{2})(\d{2})(\d{2})(?!\d)/g];
  for(const src of [String(text||''), norm(text)]){
    const c=[];
    for(const re of pats){
      re.lastIndex=0; let m;
      while((m=re.exec(src))){
        const y=+m[1],mo=+m[2],d=+m[3];
        if(mo<1||mo>12||d<1||d>31) continue;
        const dt=new Date(y,mo-1,d);
        if(dt.getMonth()!==mo-1||dt.getDate()!==d) continue;
        c.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
      }
      if(c.length) break;
    }
    if(c.length){
      // 넉 달 넘게 벗어난 것은 잘못 읽은 것 — 버립니다
      const now=Date.now();
      const ok=c.filter(d=>Math.abs(now-new Date(d+'T00:00:00').getTime())/86400000 <= 120);
      if(!ok.length) continue;
      // 같은 날짜가 여러 번 나오면 그게 맞을 확률이 높습니다
      const cnt={}; ok.forEach(d=>cnt[d]=(cnt[d]||0)+1);
      return [...new Set(ok)].sort((a,b)=>cnt[b]-cnt[a]);
    }
  }
  return [];
}
// 후보 중 하나만 (예전 쓰임새)
function pickDate(text){ const a=pickDates(text); return a.length?a[0]:''; }

/* 사진에서 읽은 날짜 후보 중, 올린 날과 견줘 말이 되는 것을 고릅니다.
   전표는 보통 당일이나 하루이틀 안에 올라옵니다. 한 달 전 날짜가 나왔다면
   그건 옛날 전표가 아니라 9를 8로 잘못 읽은 것입니다. */
function plausibleDate(cands, savedAt){
  if(!cands || !cands.length) return '';
  if(!savedAt) return cands[0];
  const day = new Date(savedAt).setHours(0,0,0,0);
  const ok = cands
    .map(d=>({d, gap:(day - new Date(d+'T00:00:00').getTime())/86400000}))
    .filter(x=> x.gap >= -1 && x.gap <= 15)      // 올린 날 기준 하루 뒤 ~ 보름 전
    .sort((a,b)=>Math.abs(a.gap)-Math.abs(b.gap));
  return ok.length ? ok[0].d : '';
}

/* 전표에 찍힌 계량 시각 (1차·2차). 숫자만 보면 되니 날짜보다 잘 읽힙니다. */
function pickTimes(text){
  const out=[];
  const re=/(\D|^)([0-2]?\d)\s*:\s*([0-5]\d)(?:\s*:\s*([0-5]\d))?(?!\d)/g;
  let m;
  while((m=re.exec(String(text||'')))){
    const h=+m[2], mi=+m[3];
    if(h>23) continue;
    out.push(`${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`);
  }
  return [...new Set(out)].slice(0,4);
}
async function readBatch(batch){
  if(!picCache[batch]){
    const res=await fetch(`${DB}/gyegeun/photos/${batch}.json`);
    if(!res.ok) return null;
    picCache[batch]=await res.json();
  }
  const url=picCache[batch];
  if(!url) return null;
  const w=await getOcr();
  let best='', bestN=-1;
  for(const tr of [{rot:0},{rot:0,h:1},{rot:90},{rot:270}]){
    const c=await prep(url,tr.rot,tr.h);
    if(!c) return null;
    const txt=(await w.recognize(c)).data.text||'';
    const got=pickWeights(txt);
    if(got.length) return {v:3, w:got, d:pickDate(txt), ds:pickDates(txt), t:pickTimes(txt), at:Date.now()};
    const n=(txt.match(/\d/g)||[]).length;
    if(n>bestN){ bestN=n; best=txt; }
  }
  return {v:3, w:[], d:pickDate(best), ds:pickDates(best), t:pickTimes(best), at:Date.now()};
}
const $ = s=>document.querySelector(s);
const comma = n=> (n||0).toLocaleString('ko-KR');
const ton = n=> (n/1000).toFixed(2);
/* toISOString 은 세계시(UTC)라 우리 시각 오전 9시 전에는 어제가 나옵니다.
   야간조가 새벽에 올린 것을 보려면 우리 날짜로 계산해야 합니다. */
const today = ()=>{ const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function toast(m,k){ const t=$('#toast'); t.textContent=m; t.className='toast on '+(k||''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',2400); }

      fetch(`${DB}/gyegeun/picgone.json`)
    ]);
    if(!rRes.ok) throw new Error(rRes.status);
    const data = await rRes.json();
    rots = (mRes.ok ? await mRes.json() : null) || {};
    chk  = (cRes.ok ? await cRes.json() : null) || {};
    okm  = (oRes.ok ? await oRes.json() : null) || {};
    pgone= (gRes.ok ? await gRes.json() : null) || {};

                  .sort((a,b)=> (b.delAt||0)-(a.delAt||0));

    $('#st').textContent='연결 실패';

/* ---------- 기간 ---------- */
function inRange(d){
  if(mode==='day'){
    // 끝 날짜를 비워두면 그 하루만, 넣으면 시작~끝 기간으로 봅니다
    const a=$('#fDay').value, b=$('#fDay2').value;
    if(!a && !b) return false;
    if(a && b)   return (a<=b) ? (d>=a && d<=b) : (d>=b && d<=a);
    return d === (a||b);
  }
  if(mode==='today') return d===today();
  if(mode==='7'){ const l=new Date(); l.setDate(l.getDate()-6);
    return d >= `${l.getFullYear()}-${String(l.getMonth()+1).padStart(2,'0')}-${String(l.getDate()).padStart(2,'0')}`; }
  return d.slice(0,7)===($('#fMonth').value || today().slice(0,7));
}
function picked(){
  const v=$('#fVeh').value, s=$('#fSeong').value, j=$('#fJo').value;
  return all.filter(r=> inRange(r.date) && (!v||r.veh===v) && (!s||r.seong===s) && (!j||joOf(r)===j));
}

/* 지금 보고 있는 기간을 글로 적어 둡니다 — 달인지 날짜 범위인지 헷갈리지 않게 */
function drawPeriod(){
  const v=$('#fVeh').value, g=$('#fSeong').value, j=$('#fJo').value;
  const f=[v?`${v}호`:'', g, j].filter(Boolean).join(' · ');
  let t, note='';
  if(mode==='day'){
    const a=$('#fDay').value, b=$('#fDay2').value;
    t = (a&&b&&a!==b) ? `${a} ~ ${b}` : (a||b||'날짜 없음');
    note = '날짜로 보는 중입니다. 위의 달 선택은 쉬고 있습니다.';
  }
  else if(mode==='today'){ t = `오늘 ${today()}`; }
  else if(mode==='7')    { t = '최근 7일'; }
  else { const m=($('#fMonth').value||today().slice(0,7)).split('-');
         t = `${m[0]}년 ${Number(m[1])}월 한 달`; }
  $('#fMonth').style.opacity = (mode==='day') ? .45 : 1;
  $('#period').className='period';
  $('#period').innerHTML = `지금 보는 기간 &nbsp;<b>${t}</b>${f?` &nbsp;·&nbsp; ${f}`:''}
    ${note?`<span style="color:#5C7EA3">${note}</span>`:''}
    ${(mode==='day'||v||g||j)?'<button class="mini x" id="bAllClear">전부 해제</button>':''}`;
}

const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
/* 보고 있는 기간의 날짜를 하루도 빠짐없이 뽑습니다 —
   전표가 하나도 없는 날이 빈칸으로 드러나야 빠진 날을 찾을 수 있습니다. */
function periodDays(rows){
  const had = [...new Set(rows.map(r=>r.date))].sort();
  let a,b;
  if(mode==='day'){ const x=$('#fDay').value, y=$('#fDay2').value;
    if(x&&y){ a = x<y?x:y; b = x<y?y:x; } else { a=b=(x||y); } }
  else if(mode==='today'){ a=b=today(); }
  else if(mode==='7'){ const l=new Date(); l.setDate(l.getDate()-6); a=ymd(l); b=today(); }
  else { const m=$('#fMonth').value||today().slice(0,7); const [y,mo]=m.split('-').map(Number);
         a=`${m}-01`; b=ymd(new Date(y,mo,0)); }
  if(!a||!b) return had;
  const out=[], d=new Date(a+'T00:00:00'), e=new Date(b+'T00:00:00');
  while(d<=e && out.length<70){ out.push(ymd(d)); d.setDate(d.getDate()+1); }
  return out.length ? out : had;
}

/* 차량 × 일자 — 한 차량이 어느 날 얼마를 실었는지 한눈에 봅니다 */
function drawGrid(rows){
  if(!rows.length){ $('#byGrid').innerHTML='<div class="empty">해당 기간에 기록이 없습니다.</div>';
                    $('#gridH').style.display='none'; return; }
  $('#gridH').style.display='';
  const ds=periodDays(rows);
  const vs=[...new Set(rows.map(r=>r.veh))].sort();
  const m={}, vt={}, dt={};
  rows.forEach(r=>{ m[r.veh+'|'+r.date]=(m[r.veh+'|'+r.date]||0)+r.weight;
                    vt[r.veh]=(vt[r.veh]||0)+r.weight; dt[r.date]=(dt[r.date]||0)+r.weight; });
  const tot = rows.reduce((a,r)=>a+r.weight,0);
  const hd = d=>{ const [y,mo,dd]=d.split('-'); const w=new Date(+y,+mo-1,+dd).getDay();
    return `<th class="r${w===0?' sun':''}">${Number(mo)}/${Number(dd)}</th>`; };
  $('#byGrid').innerHTML = `<table>
    <thead><tr><th class="vh">차량</th>${ds.map(hd).join('')}<th class="r">합계</th></tr></thead>
    <tbody>${vs.map(v=>`<tr>
      <td class="vh num" data-gv="${v}" title="${v}호만 보기">${v}</td>
      ${ds.map(d=>{ const w=m[v+'|'+d];
        const on = focus && focus.veh===v && focus.date===d;
        return w ? `<td class="r num d${on?' on':''}" data-gv="${v}" data-gd="${d}">${comma(w)}</td>`
                 : `<td class="r z">·</td>`; }).join('')}
      <td class="r b num">${comma(vt[v])}</td></tr>`).join('')}</tbody>

let vw = { batch:null, rot:0, zoom:1, x:0, y:0, base:1 };

function apply(){
  $('#vImg').style.transform = `translate(${vw.x}px,${vw.y}px) scale(${vw.base*vw.zoom}) rotate(${vw.rot}deg)`;
}
function fit(){
  const img=$('#vImg'), st=$('#vStage');
  if(!img.naturalWidth) return;
  const turned = vw.rot%180!==0;
  const w = turned?img.naturalHeight:img.naturalWidth;
  const h = turned?img.naturalWidth:img.naturalHeight;
  vw.base = Math.min((st.clientWidth-60)/w, (st.clientHeight-60)/h, 1);
  vw.zoom=1; vw.x=0; vw.y=0; apply();
}
async function showPic(batch){
  if(pgone[batch]){ toast(`${pgone[batch]} 에 사진만 지운 전표입니다 — 숫자 기록은 그대로 있습니다`,'err'); return; }
  vw={batch, rot:rots[batch]||0, zoom:1, x:0, y:0, base:1};
  $('#vCap').textContent='사진 불러오는 중';
  $('#vImg').src=''; $('#viewer').classList.add('on');
  try{
    if(!picCache[batch]){
      const res=await fetch(`${DB}/gyegeun/photos/${batch}.json`);
      picCache[batch]=await res.json();
    }
    if(!picCache[batch]) throw new Error();
    const img=$('#vImg');
    img.onload=fit;
    img.src=picCache[batch];
    const n=all.filter(r=>r.batch===batch);
    $('#vCap').textContent=`${n[0].date} · ${n[0].veh} · 전표 ${n.length}장 · ${n.map(r=>comma(r.weight)).join(' / ')} kg`;
  }catch(e){ $('#vCap').textContent='사진을 불러오지 못했습니다.'; }
}
async function saveRot(){
  if(!vw.batch) return;
  rots[vw.batch]=vw.rot;
  try{
    await fetch(`${DB}/gyegeun/rot/${vw.batch}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(vw.rot)});
  }catch(e){}
}
$('#vTop').onclick = e=>{
  const b=e.target.closest('[data-v]'); if(!b) return;
  const a=b.dataset.v;
  if(a==='x'){ $('#viewer').classList.remove('on'); return; }
  if(a==='rl'){ vw.rot=(vw.rot+270)%360; fit(); saveRot(); return; }
  if(a==='rr'){ vw.rot=(vw.rot+90)%360;  fit(); saveRot(); return; }
  if(a==='in'){ vw.zoom=Math.min(vw.zoom*1.3,12); apply(); return; }
  if(a==='out'){ vw.zoom=Math.max(vw.zoom/1.3,.3); apply(); return; }
  if(a==='fit'){ fit(); }
};
const stage=$('#vStage');
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  vw.zoom = Math.min(Math.max(vw.zoom * (e.deltaY<0?1.15:1/1.15), .3), 12);
  apply();
},{passive:false});
let drag=null;
stage.addEventListener('mousedown', e=>{ drag={sx:e.clientX-vw.x, sy:e.clientY-vw.y}; stage.classList.add('drag'); });
window.addEventListener('mousemove', e=>{ if(!drag)return; vw.x=e.clientX-drag.sx; vw.y=e.clientY-drag.sy; apply(); });
window.addEventListener('mouseup', ()=>{ drag=null; stage.classList.remove('drag'); });
stage.addEventListener('dblclick', fit);
window.addEventListener('keydown', e=>{
  if(!$('#viewer').classList.contains('on')) return;
  if(e.key==='Escape') $('#viewer').classList.remove('on');
  if(e.key==='+'||e.key==='=') { vw.zoom=Math.min(vw.zoom*1.3,12); apply(); }
  if(e.key==='-') { vw.zoom=Math.max(vw.zoom/1.3,.3); apply(); }
});
window.addEventListener('resize', ()=>{ if($('#viewer').classList.contains('on')) fit(); });

/* ---------- 사진 내려받기 · 오래된 사진 비우기 ----------
   사진은 Realtime Database 에 글자로 들어가 있어 자리를 많이 차지합니다.
   한 장에 280KB 쯤이라 한 달에 300MB씩 쌓이고, 무료 한도 1GB 를 서너 달이면 채웁니다.
   그래서 PC 로 받아 둔 뒤 오래된 것은 지웁니다. 전표 기록은 건드리지 않습니다. */

/* 압축 파일(zip)을 직접 만듭니다. 사진(JPEG)은 이미 압축돼 있어 묶기만 합니다. */
const CRCT = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRCT[(c^u8[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function zipOf(files){                 // [{name, data:Uint8Array}]
  const enc=new TextEncoder(); const parts=[]; const dir=[]; let off=0;
  const u16=v=>[v&255,(v>>8)&255];
  const u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  for(const f of files){
    const nm=enc.encode(f.name), c=crc32(f.data), n=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),
      ...u16(0),...u16(0),...u32(c),...u32(n),...u32(n),...u16(nm.length),...u16(0)]);
    parts.push(lh, nm, f.data);
    dir.push({nm,c,n,off});
    off += lh.length + nm.length + n;
  }
  const cd=[]; let cdlen=0;
  for(const d of dir){
    const h=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),
      ...u16(0),...u16(0),...u32(d.c),...u32(d.n),...u32(d.n),...u16(d.nm.length),
      ...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(d.off)]);
    cd.push(h, d.nm); cdlen += h.length + d.nm.length;
  }
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(dir.length),...u16(dir.length),...u32(cdlen),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/zip'});
}
function dataUrlBytes(u){
  const b=atob(String(u).split(',')[1]||'');
  const a=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i);
  return a;
}
const safe = t => String(t||'').replace(/[\\/:*?"<>|]/g,'_');

/* 지금 보고 있는 기간의 사진을 zip 한 개로 받습니다 */
async function downloadPics(){
  const rows = picked().filter(r=>r.batch);
  const bats = [...new Set(rows.map(r=>r.batch))].filter(b=>!pgone[b]);
  const cut  = [...new Set(rows.map(r=>r.batch))].filter(b=>pgone[b]).length;   // 이미 사진만 지운 것
  if(!bats.length){ toast(cut?`이 기간 사진 ${comma(cut)}장은 이미 지워졌습니다`:'이 기간에 사진이 없습니다','err'); return; }
  if(bats.length>250 && !confirm(
      `사진이 ${comma(bats.length)}장입니다. 한 번에 받으면 오래 걸리고 멈출 수 있습니다.\n\n`
      + `날짜를 나눠서 받으시는 편이 안전합니다. 그래도 계속할까요?`)) return;
  const bar=$('#picbar');
  const files=[], list=[]; let done=0, bytes=0;
  let gone=0, failed=0;      // 서버에 사진이 없는 것 / 받다가 실패한 것
  for(const b of bats){
    bar.innerHTML = `<div class="chkbar"><span>사진 모으는 중 ${done}/${bats.length}</span>
      <div class="bar"><i style="width:${Math.round(done/bats.length*100)}%"></i></div></div>`;
    try{
      if(!picCache[b]){
        const res=await fetch(`${DB}/gyegeun/photos/${b}.json`);
        picCache[b]=await res.json();
      }
      if(picCache[b]){
        // 한 사진에 전표가 여러 장 붙어 있을 수 있어 그 묶음을 다 적습니다
        const rs = rows.filter(x=>x.batch===b);
        const r  = rs[0];
        const ws = rs.map(x=>x.weight).join('+');
        const nos= [...new Set(rs.map(x=>x.no).filter(Boolean))].join('-');
        // 차량번호 폴더 안에 넣습니다 — PC 에서 차량별로 바로 갈라져 보입니다
        const nm = `${safe(r.veh)}호/${r.date}_${safe(r.veh)}_${safe(r.seong)}_${ws}kg`
                 + (nos?`_전표${safe(nos)}`:'') + `_${b.slice(-4)}.jpg`;
        const u8 = dataUrlBytes(picCache[b]);
        files.push({name:nm, data:u8}); bytes += u8.length;
        rs.forEach(x=>list.push([x.date, x.veh, x.seong, x.site||'', x.weight,
                                 x.no||'', x.t1||'', x.t2||'', nm]));
      }
      else gone++;                       // 전표에는 사진 표시가 있는데 서버에 없는 것
    }catch(e){ failed++; }
    done++;
  }
  bar.innerHTML='';
  if(!files.length){ toast('사진을 못 받았습니다','err'); return; }
  // 어떤 사진이 어느 전표인지 적은 목록도 같이 넣습니다
  list.sort((a,b)=> String(a[0]).localeCompare(String(b[0])) || String(a[1]).localeCompare(String(b[1])));
  const head='날짜,차량번호,성상,반입처,실중량,전표번호,1차시각,2차시각,사진파일';
  const csv='\ufeff'+head+'\n'+list.map(r=>r.join(',')).join('\n');
  files.push({name:'_사진목록.csv', data:new TextEncoder().encode(csv)});
  picGot = true;                         // 이번 화면에서 받아 둔 것이 있습니다
  const blob = zipOf(files);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`계근사진_${picTag()}.zip`;
  document.body.appendChild(a);          // 붙여야 파일 이름이 제대로 붙습니다
  a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 30000);
  const msg = `사진 ${comma(files.length-1)}장 · ${(bytes/1048576).toFixed(1)}MB 받았습니다.`
    + (gone   ? `  서버에 사진이 없는 것 ${comma(gone)}장.` : '')
    + (failed ? `  못 받은 것 ${comma(failed)}장 — 다시 눌러 보세요.` : '')
    + (cut    ? `  예전에 사진만 지운 것 ${comma(cut)}장.` : '');
  $('#picbar').innerHTML = `<div class="xw" style="background:#EEF4FB;border-color:#C7D8EC;padding:12px 16px">
     <p style="color:#2C5A8A;margin:0">${msg}<br>
     이 기간 전표 ${comma(picked().length)}건 중 사진이 붙은 것 ${comma(bats.length)}장이었습니다.
     ${gone?'<br><b>사진이 없는 것</b>은 예전에 지워졌거나 기사님 폰에서 올라오다 끊긴 것입니다. 숫자 기록은 그대로 있습니다.':''}
     </p></div>`;
  toast(msg,'good');
}
function picTag(){
  const a=$('#fDay').value, b=$('#fDay2').value;
  if(mode==='day') return (a&&b&&a!==b) ? `${a}_${b}` : (a||b);
  if(mode==='today') return today();
  if(mode==='7') return `최근7일_${today()}`;
  return $('#fMonth').value || today().slice(0,7);
}

/* 지금 화면에 보이는 기간의 사진만 지웁니다. 전표 기록은 한 건도 건드리지 않습니다. */
function picLabel(){
  const v=$('#fVeh').value, g=$('#fSeong').value, j=$('#fJo').value;
  let t;
  if(mode==='day'){ const a=$('#fDay').value, b=$('#fDay2').value;
    t = (a&&b&&a!==b) ? `${a} ~ ${b}` : (a||b||'날짜 없음'); }
  else if(mode==='today') t = `오늘 (${today()})`;
  else if(mode==='7')     t = '최근 7일';
  else t = ($('#fMonth').value || today().slice(0,7)) + ' 한 달';
  return t + (v?` · ${v}호`:'') + (g?` · ${g}`:'') + (j?` · ${j}`:'');
}
async function purgePics(){
  const rows = picked().filter(r=>r.batch);
  const all2 = [...new Set(rows.map(r=>r.batch))];
  const keep = new Set();
  trash.forEach(r=>{ if(r.batch) keep.add(r.batch); });      // 휴지통 것은 남깁니다
  const gone = all2.filter(b=>!pgone[b] && !keep.has(b));    // 이미 지운 것도 건너뜁니다
  if(!gone.length){
    toast(all2.length? '이 기간 사진은 이미 다 지웠습니다' : '이 기간에 지울 사진이 없습니다','err'); return; }
  const n = rows.filter(r=>gone.includes(r.batch)).length;
  // 최근 두 달 안의 사진이 섞여 있으면 한 번 더 일러 둡니다
  const cut = new Date(); cut.setMonth(cut.getMonth()-2);
  const cutS = `${cut.getFullYear()}-${String(cut.getMonth()+1).padStart(2,'0')}-${String(cut.getDate()).padStart(2,'0')}`;
  const fresh = [...new Set(rows.filter(r=>r.date>=cutS && gone.includes(r.batch)).map(r=>r.batch))].length;
  if(!confirm(
      `【${picLabel()}】\n`
      + `사진 ${comma(gone.length)}장을 지웁니다. 약 ${(gone.length*0.28).toFixed(0)}MB 가 비워집니다.\n\n`
      + `■ 남는 것 — 전표 ${comma(n)}건의 날짜·차량·성상·반입처·1차·2차·실중량·전표번호·계근시각.\n`
      + `   한 건도 지우지 않습니다. 엑셀·조회·집계 모두 그대로입니다.\n`
      + `■ 없어지는 것 — 전표 사진(그림)뿐입니다. 사진칸이 「사진 지움」으로 바뀝니다.\n\n`
      + (picGot ? `사진은 방금 PC로 받아 두셨습니다.\n` : `⚠ 이 화면에서 아직 사진을 받지 않으셨습니다.\n   먼저 「사진 내려받기」로 PC에 받아 두시는 편이 안전합니다.\n`)
      + `사진은 되돌릴 수 없습니다. 지울까요?`)) return;
  if(fresh && !confirm(
      `한 번 더 여쭙니다.\n\n`
      + `이 중 ${comma(fresh)}장은 ${cutS} 이후, 즉 최근 두 달 안의 사진입니다.\n`
      + `판독이 틀린 전표를 아직 종이 없이 확인해야 할 수 있는 기간입니다.\n\n`
      + `그래도 지울까요?`)) return;
  const bar=$('#picbar');
  try{
    for(let i=0;i<gone.length;i+=200){
      const chunk=gone.slice(i,i+200); const pp={};
      chunk.forEach(b=>pp[b]=null);
      bar.innerHTML = `<div class="chkbar"><span>지우는 중 ${i}/${gone.length}</span>
        <div class="bar"><i style="width:${Math.round(i/gone.length*100)}%"></i></div></div>`;
      const res=await fetch(`${DB}/gyegeun/photos.json`,{method:'PATCH',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(pp)});
      if(!res.ok) throw new Error(res.status);
      // 지웠다는 표시만 남깁니다 — 한 건에 30바이트쯤이라 용량에 영향이 없습니다
      const mk={}; chunk.forEach(b=>mk[b]=today());
      await fetch(`${DB}/gyegeun/picgone.json`,{method:'PATCH',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(mk)});
      chunk.forEach(b=>{ delete picCache[b]; pgone[b]=today(); });
    }
    bar.innerHTML='';
    toast(`사진 ${comma(gone.length)}장 지웠습니다 — 전표 기록은 그대로입니다`,'good');
    render();
    $('#picbar').innerHTML = `<div class="xw" style="background:#EEF4FB;border-color:#C7D8EC;padding:12px 16px">
       <p style="color:#2C5A8A;margin:0">【${picLabel()}】 사진 ${comma(gone.length)}장(약 ${(gone.length*0.28).toFixed(0)}MB)을 지웠습니다.
       전표 ${comma(n)}건의 숫자 기록은 그대로 남아 있고, 사진칸만 「사진 지움」으로 바뀝니다.</p></div>`;
  }catch(e){ bar.innerHTML=''; toast('지우지 못했습니다 — 인터넷을 확인하세요','err'); }
}

/* ---------- 휴지통 ----------
   지운 전표는 없애지 않고 휴지통으로 옮깁니다. 사진도 같이 남겨 둡니다.
   잘못 지운 것을 되돌릴 수 있어야 하니까요. */
async function toTrash(rows){
  const put={}, now=Date.now();
  rows.forEach(r=>{ const {id,...v}=r; put[id] = {...v, delAt: now}; });
  const res = await fetch(`${DB}/gyegeun/trash.json`,{method:'PATCH',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(put)});
  if(!res.ok) throw new Error('trash '+res.status);
  rows.forEach(r=>trash.unshift({...r, delAt: now}));
}
async function restore(id){
  const r = trash.find(x=>x.id===id); if(!r) return;
  if(!confirm(`${r.date} · ${r.veh} · ${r.seong} · ${comma(r.weight)}kg\n\n이 전표를 되살립니다.`)) return;
  const {id:_i, delAt, ...v} = r;
  try{
    const res = await fetch(`${DB}/gyegeun/records/${id}.json`,{method:'PUT',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(v)});
    if(!res.ok) throw new Error();
    fetch(`${DB}/gyegeun/trash/${id}.json`,{method:'DELETE'}).catch(()=>{});
    trash = trash.filter(x=>x.id!==id);
    all.push({id,...v});
    all.sort((a,b)=> a.date.localeCompare(b.date) || a.at-b.at);
    $('#st').textContent=`전표 ${comma(all.length)}건`;
    fillSelects(); render(); toast('되살렸습니다','good');
  }catch(e){ toast('되살리지 못했습니다','err'); }
}
async function restoreAll(){
  const rows = trashShown();
  if(!rows.length) return;
  if(!confirm(`지금 보이는 ${comma(rows.length)}건을 모두 되살립니다.`)) return;
  const put={}; rows.forEach(r=>{ const {id,delAt,...v}=r; put[id]=v; });
  try{
    const res=await fetch(`${DB}/gyegeun/records.json`,{method:'PATCH',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(put)});
    if(!res.ok) throw new Error();
    const d={}; rows.forEach(r=>d[r.id]=null);
    fetch(`${DB}/gyegeun/trash.json`,{method:'PATCH',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)}).catch(()=>{});
    const back=new Set(rows.map(r=>r.id));
    trash = trash.filter(x=>!back.has(x.id));
    rows.forEach(r=>{ const {delAt,...v}=r; all.push(v); });
    all.sort((a,b)=> a.date.localeCompare(b.date) || a.at-b.at);
    $('#st').textContent=`전표 ${comma(all.length)}건`;
    fillSelects(); render(); toast(`${comma(rows.length)}건 되살렸습니다`,'good');
  }catch(e){ toast('되살리지 못했습니다','err'); }
}
async function emptyTrash(){
  const old = trash.filter(r=> !r.delAt || Date.now()-r.delAt > 30*86400000);
  if(!old.length){ toast('지운 지 30일 넘은 것이 없습니다','err'); return; }
  if(!confirm(`지운 지 30일이 넘은 ${comma(old.length)}건을 완전히 없앱니다.\n\n`
            + `이건 정말로 되돌릴 수 없습니다. 계속할까요?`)) return;
  const d={}, pics={};
  old.forEach(r=>{ d[r.id]=null; if(r.batch) pics[r.batch]=null; });
  try{
    const res=await fetch(`${DB}/gyegeun/trash.json`,{method:'PATCH',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)});
    if(!res.ok) throw new Error();
    // 아직 쓰이는 사진은 남깁니다
    const still=new Set(all.map(x=>x.batch).filter(Boolean));
    trash.filter(r=>!d[r.id]).forEach(r=>{ if(r.batch) still.add(r.batch); });
    Object.keys(pics).forEach(b=>{ if(still.has(b)) delete pics[b]; });
    if(Object.keys(pics).length)
      fetch(`${DB}/gyegeun/photos.json`,{method:'PATCH',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(pics)}).catch(()=>{});
    const gone=new Set(old.map(r=>r.id));
    trash = trash.filter(x=>!gone.has(x.id));
    render(); toast(`${comma(old.length)}건 완전히 없앴습니다`,'good');
  }catch(e){ toast('비우지 못했습니다','err'); }
}

/* ---------- 사진 대조 실행 ---------- */
function chkBar(done,total,msg){
  if(total===null){ $('#chkbar').innerHTML=''; return; }
  const pct = total ? Math.round(done/total*100) : 0;
  $('#chkbar').innerHTML = `<div class="chkbar">
    <span>${msg||`사진 대조 중 ${done}/${total}`}</span>
    <span class="bar"><i style="width:${pct}%"></i></span>
    <button class="chip" id="bChkStop">멈추기</button></div>`;
  const b=$('#bChkStop'); if(b) b.onclick=()=>{ chkStop=true; };
}
async function runCheck(){
  if(chkRunning) return;
  const rows = picked().filter(r=>r.batch);
  // v2 이전 결과는 판독 규칙이 허술하던 때 것이라 다시 읽습니다
  const todo = [...new Set(rows.map(r=>r.batch))].filter(b=>!chk[b] || (chk[b].v||1) < 3);
  if(!todo.length){
    chkBar(0,null);
    toast(rows.length ? '이미 다 대조했습니다' : '사진이 있는 전표가 없습니다');
    render(); return;
  }
  chkRunning=true; chkStop=false;
  chkBar(0,todo.length,'판독기 준비 중 — 처음 한 번만 걸립니다');
  let done=0;
  for(const b of todo){
    if(chkStop) break;
    try{
      const r = await readBatch(b);
      if(r){
        chk[b]=r;
        fetch(`${DB}/gyegeun/chk/${b}.json`,{method:'PUT',
          headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}).catch(()=>{});
      }
    }catch(e){}
    done++;
    chkBar(done,todo.length);
    if(done%5===0) render();
  }
  chkRunning=false;
  chkBar(0,null);
  render();
  const read = todo.filter(b=>chk[b] && chk[b].w && chk[b].w.length).length;
  toast((chkStop ? `${done}장까지 대조하고 멈췄습니다` : `사진 ${done}장 대조 완료`)
      + ` — ${read}장에서 숫자를 읽었습니다`,'good');
}

   || a.weight-b.weight);
  if(!rows.length){ toast('내려받을 기록이 없습니다','err'); return; }
  const head='날짜,전표번호,1차시각,2차시각,조,차량번호,성상,반입처,실중량';
  const body=rows.map(r=>[r.date,r.no||'',r.t1||'',r.t2||'',joOf(r),r.veh,r.seong,r.site||'',r.weight].join(',')).join('\n');
  const blob=new Blob(['\ufeff'+head+'\n'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const a1=$('#fDay').value, b1=$('#fDay2').value;
  const tag = mode==='day' ? (a1&&b1&&a1!==b1 ? `${a1}_${b1}` : (a1||b1))
            : mode==='today' ? today()
            : mode==='7' ? `최근7일_${today()}`
            : ($('#fMonth').value||today().slice(0,7));
  a.download=`계근대장_${tag}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};

/* ---------- 일괄 입력 ---------- */
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// 한 줄에 실중량 하나. 4,280 처럼 천단위 쉼표는 지웁니다.
function eNums(){
  return $('#eText').value.split(/[\n,;\t]+/)
    .map(x=>parseInt(String(x).replace(/[^0-9]/g,''),10))
    .filter(n=>n>0).map(w=>({w, bad:w>60000}));
}
function ePreview(){
  const n=eNums(), bn=n.filter(x=>x.bad).length;
  $('#ePv').innerHTML=`전표 <b>${n.length}</b>장 · 합계 <b class="num">${comma(n.reduce((a,b)=>a+b.w,0))}</b> kg`
    + (bn?` · <b style="color:var(--bad)">확인 필요 ${bn}줄</b>`:'');
}
function eInit(){
  $('#eDate').value = today();
  $('#eVeh').innerHTML = Object.keys(CARS).map(v=>`<option value="${v}">${v}</option>`).join('');
  $('#eSeong').innerHTML = '<option value="">— 성상을 고르세요 —</option>'+SEONG.map(s=>`<option>${s}</option>`).join('');
  $('#eSite').innerHTML = siteOptions();
  eSync(); ePreview();
}
function eSync(){
  const c=CARS[$('#eVeh').value];
  if(!c) return;
  $('#eSeong').value = c.s || '';
  if(!allSites().includes(c.d)) addSite(c.d);
  $('#eSite').innerHTML = siteOptions(c.d);
  $('#eSite').value = c.d;
  const sel=$('#eSeong');
  sel.style.borderColor = c.s ? '' : 'var(--acc)';
}
$('#bToggle').onclick = ()=>{
  const el=$('#entry'), on=el.classList.toggle('on');
  $('#bToggle').classList.toggle('sel',on);
  if(on) $('#eText').focus();
};
$('#eVeh').onchange = eSync;
$('#eSite').onchange = e=>siteChange(e.target);
$('#eText').oninput = ePreview;
$('#eClear').onclick = ()=>{ $('#eText').value=''; ePreview(); $('#eText').focus(); };
$('#eSave').onclick = async ()=>{
  const nums=eNums();
  if(!nums.length){ toast('실중량을 입력하세요','err'); return; }
  const date=$('#eDate').value, veh=$('#eVeh').value, seong=$('#eSeong').value, site=$('#eSite').value;
  const jo=(CARS[veh]||{}).j || '';
  if(!date){ toast('계근일을 정하세요','err'); return; }
  if(nums.some(x=>x.bad) && !confirm('중량이 이상한 줄이 있습니다. 그대로 저장할까요?')) return;
  if(!seong){ toast('성상을 고르세요','err'); $('#eSeong').focus(); return; }
  if(!confirm(`${date} · ${veh} · ${seong} · ${site}\n전표 ${nums.length}장 (${comma(nums.reduce((a,b)=>a+b.w,0))} kg)\n\n저장할까요?`)) return;
  $('#eSave').disabled=true; $('#eSave').textContent='저장 중';
  let ok=0;
  for(const it of nums){
    const w=it.w, id=uid();
    try{
      const res=await fetch(`${DB}/gyegeun/records/${id}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({date,jo,veh,seong,site,weight:w,gross:null,tare:null,batch:null,at:Date.now()})});
      if(res.ok) ok++;
    }catch(e){}
  }
  $('#eSave').disabled=false; $('#eSave').textContent='저장';
  if(ok===nums.length){ $('#eText').value=''; ePreview(); toast(`${ok}장 저장했습니다`,'good'); $('#eText').focus(); }
  else toast(`${ok}/${nums.length}장만 저장됐습니다`,'err');
  load();
};

/* ---------- 시작 ---------- */
eInit();
$('#fMonth').value = today().slice(0,7);
/* 머리글 높이를 재서 툴바가 그 바로 아래에 붙게 합니다 */
function fixBarTop(){
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hdr', h+'px');
}
fixBarTop();
window.addEventListener('resize', fixBarTop);
load();
setInterval(()=>{ if(!$('#viewer').classList.contains('on')) load(); }, 120000);
</script>
</body>
</html>
