<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#28363f">
<link rel="manifest" href="manifest.json">
<title>계근 전표 (시험)</title>
<style>
  :root{
    --bg:#eceef0; --card:#fff; --ink:#14181c; --dim:#5c666f;
    --line:#d2d7dc; --rule:#eef0f2; --steel:#28363f; --steel-dim:#b3c1cb;
    --ok:#0d6f43; --ok-bg:#e2f3ea; --bad:#a5281e; --bad-bg:#fbe8e6; --bad-line:#f0c2bc;
    --warn:#7d5800; --warn-bg:#fcf2da; --warn-line:#e9d5a4; --chip:#e7ecf0;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#11161a; --card:#1b2228; --ink:#e8edf1; --dim:#9aa7b1;
      --line:#2d373f; --rule:#242d34; --steel:#0d1317; --steel-dim:#8fa2af;
      --ok:#5fcf9a; --ok-bg:#123028; --bad:#ff9d92; --bad-bg:#37201d; --bad-line:#5c302b;
      --warn:#e5c173; --warn-bg:#2f2717; --warn-line:#4a3d1e; --chip:#28323a;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-text-size-adjust:100%}

  .bar{position:sticky;top:0;z-index:20;background:var(--steel);color:#fff;
    display:flex;align-items:center;padding:0 6px;padding-top:env(safe-area-inset-top)}
  .bar h1{flex:1;font-size:16px;font-weight:600;margin:0;padding:0 8px}
  .bar button{appearance:none;background:none;border:0;color:var(--steel-dim);
    font:inherit;font-size:15px;font-weight:600;padding:13px 12px;cursor:pointer}
  .bar button.on{color:#fff;box-shadow:inset 0 -3px 0 #fff}

  .wrap{max-width:620px;margin:0 auto;padding:12px 12px 120px}
  .page{display:none}.page.on{display:block}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:13px;margin-bottom:11px}
  .lab{font-size:13px;color:var(--dim);margin-bottom:7px;font-weight:600}

  .row{display:flex;gap:7px;flex-wrap:wrap}
  .seg{flex:1 1 0;min-width:70px;appearance:none;font:inherit;font-weight:600;
    padding:12px 6px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer}
  .seg.on{background:var(--steel);border-color:var(--steel);color:#fff}
  .seg:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #6f9fc4;outline-offset:2px}

  input,select{font:inherit;width:100%;padding:12px 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--ink)}
  input[type=date]{min-height:47px}
  .num{font-variant-numeric:tabular-nums;font-size:21px;font-weight:700;text-align:right}

  .big{width:100%;appearance:none;border:0;border-radius:10px;background:var(--steel);
    color:#fff;font:inherit;font-size:18px;font-weight:700;padding:17px;cursor:pointer}
  .big.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:16px}
  .big:disabled{opacity:.45}

  #shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #shots img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

  .wline{border-top:1px solid var(--rule);padding:11px 0}
  .wline:first-child{border-top:0;padding-top:2px}
  .whead{display:flex;align-items:center;gap:9px}
  .wno{width:23px;font-size:14px;color:var(--dim);font-weight:700;flex:none}
  .wkg{font-size:15px;color:var(--dim);flex:none}
  .wdel{flex:none;appearance:none;border:0;background:none;color:var(--dim);
    font-size:20px;padding:6px 8px;cursor:pointer;line-height:1}
  .wmore{margin:8px 0 0 32px;display:none}
  .wmore.on{display:block}
  .wtoggle{appearance:none;border:0;background:none;color:var(--dim);font:inherit;
    font-size:13px;padding:5px 0 0 32px;cursor:pointer;text-decoration:underline}
  .pair{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  .pair input{font-variant-numeric:tabular-nums;text-align:right}
  .pair span{font-size:13px;color:var(--dim);flex:none}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:5px}
  .chk.ok{color:var(--ok)}.chk.bad{color:var(--bad)}

  .sum{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
    border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom))}
  .sum .inner{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:11px}
  .sum .t{flex:1;font-size:14px;color:var(--dim);min-width:0}
  .sum .t b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
  .sum .big{width:auto;flex:none;padding:15px 26px}

  .msg{display:none;padding:11px 13px;border-radius:8px;font-size:14.5px;margin-bottom:11px;
    background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
  .msg.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
  .msg.err{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}

  .vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
  .vbtn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:8px;padding:11px 4px;font:inherit;cursor:pointer;text-align:center}
  .vbtn b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .vbtn span{font-size:11.5px;color:var(--dim)}
  .vbtn.on{background:var(--steel);border-color:var(--steel);color:#fff}
  .vbtn.on span{color:var(--steel-dim)}
  .grp{font-size:12.5px;color:var(--dim);font-weight:600;margin:13px 0 7px}
  .grp:first-child{margin-top:0}

  .note{font-size:13px;color:var(--dim);line-height:1.6;margin:0}
  .warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
    border-radius:8px;padding:11px 13px;font-size:13.5px;margin-bottom:11px}
</style>
</head>
<body>

<div class="bar">
  <h1>계근 전표 <span style="opacity:.6;font-weight:400">시험용</span></h1>
  <button id="tabIn" class="on">입력</button>
  <button id="tabSet">설정</button>
</div>

<div class="wrap">

<!-- ================= 입력 ================= -->
<div class="page on" id="pgIn">
  <div class="msg" id="msg"></div>
  <div class="warnbox" id="target"></div>

  <div class="card">
    <div class="lab">계근일</div>
    <div class="row" style="margin-bottom:9px">
      <button class="seg" id="dYes">어제</button>
      <button class="seg" id="dTod">오늘</button>
    </div>
    <input type="date" id="date">
  </div>

  <div class="card" id="vehCard">
    <div class="lab">차량</div>
    <div id="vehNow" style="font-size:20px;font-weight:700">—</div>
    <div class="note" id="vehHint" style="margin-top:4px">설정에서 차량을 먼저 고르세요.</div>
  </div>

  <div class="card">
    <div class="lab">성상</div>
    <select id="seong"></select>
    <div class="lab" style="margin:12px 0 7px">반입처</div>
    <select id="site"></select>
  </div>

  <div class="card">
    <div class="lab">전표 사진</div>
    <button class="big ghost" id="shoot">사진 찍기</button>
    <input type="file" id="cam" accept="image/*" capture="environment">
    <div id="shots"></div>
  </div>

  <div class="card">
    <div class="lab">실중량 (kg)</div>
    <div id="lines"></div>
  </div>
</div>

<!-- ================= 설정 ================= -->
<div class="page" id="pgSet">
  <div class="card">
    <div class="lab">차량 고르기 — 한 번 고르면 이 폰에 저장됩니다</div>
    <div id="vehPick"></div>
  </div>

  <div class="card">
    <div class="lab">저장 위치</div>
    <div class="row">
      <button class="seg" id="nodeTest">시험용</button>
      <button class="seg" id="nodeReal">실제</button>
    </div>
    <p class="note" style="margin-top:9px">시험용으로 두면 따로 쌓여서 사무실 화면과 엑셀에 안 나옵니다. 마음 놓고 연습하세요. 실제로 바꾸면 지금 쓰는 앱과 같은 자리에 저장됩니다.</p>
  </div>

  <div class="card">
    <div class="lab">못 보낸 전표</div>
    <div id="qInfo" style="font-size:16px;margin-bottom:9px">없음</div>
    <button class="big ghost" id="qSend">지금 보내기</button>
  </div>

  <div class="card">
    <p class="note">전파가 없으면 폰에 쌓아뒀다가 연결되면 저절로 보냅니다. 앱을 꺼도 남아 있습니다.</p>
  </div>
</div>

</div>

<div class="sum">
  <div class="inner">
    <div class="t"><span id="sumTxt">전표 0장</span><b id="sumKg">0 kg</b></div>
    <button class="big" id="save">저장</button>
  </div>
</div>

<script>
'use strict';
const $ = i => document.getElementById(i);
const DB = 'https://minwon-c29c2-default-rtdb.asia-southeast1.firebasedatabase.app';

const SEONG = ['생활','음식물','음식물(다량)','재활용','재활용(다량)','대형','기타'];
const SITES = ['자원순환공원','강남자원회수시설','뉴그린','대일개발','리누','번영','케이텍'];

const VEH = [
  {g:'생활 · 자원순환공원', list:[['7201','88나7201','생활','자원순환공원'],['2759','84루2759','생활','자원순환공원']]},
  {g:'생활 · 강남자원회수시설', list:[['3587','84루3587','생활','강남자원회수시설'],['4359','89머4359','생활','강남자원회수시설']]},
  {g:'음식물', list:[['9033','90오9033','음식물','자원순환공원'],['8078','90오8078','음식물','자원순환공원']]},
  {g:'재활용', list:[['1351','804조1351','재활용','자원순환공원'],['7538','82마7538','재활용','자원순환공원'],['8326','90오8326','재활용','자원순환공원'],['7657','82마7657','재활용','자원순환공원']]},
  {g:'대형', list:[['8686','877가8686','대형','자원순환공원'],['8666','877가8666','대형','자원순환공원']]},
  {g:'성상을 매번 고르는 차량', list:[['1286','83도1286','',''],['5635','84도5635','',''],['6110','86모6110','',''],['7507','85노7507','',''],['4830','86마4830','',''],['4968','86마4968','','']]}
];
const vehInfo = v => { for(const g of VEH) for(const c of g.list) if(c[0]===v) return c; return null; };

const LS = {
  get:(k,d)=>{ try{ const v=localStorage.getItem('g2_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set:(k,v)=>{ try{ localStorage.setItem('g2_'+k, JSON.stringify(v)); }catch(e){} }
};

let veh   = LS.get('veh', null);
let node  = LS.get('node', 'gyegeun2');
let sites = LS.get('sites', SITES.slice());
let photos = [];          // {b64, url}
let queue = LS.get('queue', []);

/* ---------- 날짜 ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function setDate(which){
  const d = new Date();
  if(which === 'y') d.setDate(d.getDate()-1);
  $('date').value = ymd(d);
  markDate();
}
function markDate(){
  const t = ymd(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  $('dTod').classList.toggle('on', $('date').value === t);
  $('dYes').classList.toggle('on', $('date').value === ymd(y));
}
$('dYes').onclick = () => setDate('y');
$('dTod').onclick = () => setDate('t');
$('date').onchange = markDate;
setDate(new Date().getHours() < 9 ? 'y' : 't');   // 새벽·아침 일찍 열면 어제

/* ---------- 목록 ---------- */
function fillSelects(){
  $('seong').innerHTML = SEONG.map(s=>`<option>${s}</option>`).join('');
  drawSites();
}
function drawSites(){
  $('site').innerHTML = sites.map(s=>`<option>${s}</option>`).join('')
    + '<option value="__new">+ 직접 입력</option>';
}
$('site').onchange = e => {
  if(e.target.value !== '__new') return;
  const v = (prompt('반입처 이름') || '').trim();
  if(v){ if(!sites.includes(v)){ sites.push(v); LS.set('sites', sites); } drawSites(); $('site').value = v; }
  else drawSites();
};

/* ---------- 차량 ---------- */
function drawVehPick(){
  $('vehPick').innerHTML = VEH.map(g =>
    `<div class="grp">${g.g}</div><div class="vlist">` +
    g.list.map(c=>`<button class="vbtn${c[0]===veh?' on':''}" data-v="${c[0]}"><b>${c[0]}</b><span>${c[1]}</span></button>`).join('') +
    `</div>`).join('');
  $('vehPick').querySelectorAll('.vbtn').forEach(b => b.onclick = () => {
    veh = b.dataset.v; LS.set('veh', veh); drawVehPick(); applyVeh(); go('in');
  });
}
function applyVeh(){
  const c = vehInfo(veh);
  if(!c){ $('vehNow').textContent = '—'; $('vehHint').textContent = '설정에서 차량을 먼저 고르세요.'; return; }
  $('vehNow').textContent = `${c[0]}  ${c[1]}`;
  if(c[2]){ $('seong').value = c[2]; $('site').value = c[3]; $('vehHint').textContent = '성상과 반입처가 자동으로 맞춰졌습니다. 다르면 아래에서 바꾸세요.'; }
  else { $('vehHint').textContent = '이 차량은 성상을 매번 골라야 합니다.'; }
}

/* ---------- 탭 ---------- */
function go(p){
  $('pgIn').classList.toggle('on', p==='in');
  $('pgSet').classList.toggle('on', p!=='in');
  $('tabIn').classList.toggle('on', p==='in');
  $('tabSet').classList.toggle('on', p!=='in');
  document.querySelector('.sum').style.display = p==='in' ? '' : 'none';
  window.scrollTo(0,0);
}
$('tabIn').onclick = () => go('in');
$('tabSet').onclick = () => go('set');

/* ---------- 저장 위치 ---------- */
function drawNode(){
  $('nodeTest').classList.toggle('on', node==='gyegeun2');
  $('nodeReal').classList.toggle('on', node==='gyegeun');
  $('target').textContent = node==='gyegeun'
    ? '실제 저장 — 사무실 화면과 엑셀에 그대로 올라갑니다.'
    : '시험용 저장 — 따로 쌓이며 사무실 화면·엑셀에는 안 나옵니다.';
  $('target').style.display = 'block';
}
$('nodeTest').onclick = () => { node='gyegeun2'; LS.set('node',node); drawNode(); };
$('nodeReal').onclick = () => {
  if(!confirm('실제 자리에 저장하도록 바꿉니다. 사무실 화면과 엑셀에 그대로 반영됩니다. 계속할까요?')) return;
  node='gyegeun'; LS.set('node',node); drawNode();
};

/* ---------- 사진 ---------- */
$('shoot').onclick = () => $('cam').click();
$('cam').onchange = e => { const f = e.target.files[0]; if(f) shrink(f); e.target.value=''; };

function shrink(file){
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1500/Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const url = c.toDataURL('image/jpeg', 0.55);
      photos.push({ b64:url.split(',')[1], url });
      drawShots();
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function drawShots(){
  $('shots').innerHTML = photos.map((p,i)=>`<img src="${p.url}" data-i="${i}" alt="전표 사진 ${i+1}">`).join('');
  $('shots').querySelectorAll('img').forEach(im => im.onclick = () => {
    if(confirm('이 사진을 뺄까요?')){ photos.splice(+im.dataset.i,1); drawShots(); }
  });
}

/* ---------- 실중량 줄 ---------- */
let lines = [];   // {w, gross, tare, site, seong, open}
function blank(){ return {w:'', gross:'', tare:'', site:'', seong:'', open:false}; }
lines.push(blank());

function drawLines(){
  const box = $('lines');
  box.innerHTML = '';
  lines.forEach((L,i) => {
    const el = document.createElement('div');
    el.className = 'wline';
    const g = L.gross!=='' ? Number(L.gross) : null;
    const t = L.tare!==''  ? Number(L.tare)  : null;
    let chk = '';
    if(g!==null && t!==null && !isNaN(g) && !isNaN(t)){
      const d = Math.abs(g-t);
      const ok = L.w!=='' && Number(L.w) === d;
      chk = `<div class="chk ${L.w===''?'':(ok?'ok':'bad')}">큰 값 − 작은 값 = ${d.toLocaleString('ko-KR')} kg${L.w===''?' (아래에 넣습니다)':(ok?'  맞음':'  실중량과 다릅니다')}</div>`;
    }
    el.innerHTML =
      `<div class="whead">
         <span class="wno">${i+1}</span>
         <input class="num" inputmode="numeric" data-k="w" data-i="${i}" value="${L.w}" placeholder="0">
         <span class="wkg">kg</span>
         <button class="wdel" data-del="${i}" aria-label="이 줄 지우기">×</button>
       </div>
       <button class="wtoggle" data-t="${i}">${L.open?'접기':'다르면 수정'}</button>
       <div class="wmore${L.open?' on':''}">
         <div class="pair"><span style="width:52px">1차</span><input class="num" inputmode="numeric" data-k="gross" data-i="${i}" value="${L.gross}" placeholder="—"></div>
         <div class="pair"><span style="width:52px">2차</span><input class="num" inputmode="numeric" data-k="tare" data-i="${i}" value="${L.tare}" placeholder="—"></div>
         ${chk}
         <div class="pair" style="margin-top:9px"><span style="width:52px">성상</span><select data-k="seong" data-i="${i}">${['(위와 같음)'].concat(SEONG).map(s=>`<option value="${s==='(위와 같음)'?'':s}"${L.seong===s?' selected':''}>${s}</option>`).join('')}</select></div>
         <div class="pair"><span style="width:52px">반입처</span><select data-k="site" data-i="${i}">${['(위와 같음)'].concat(sites).map(s=>`<option value="${s==='(위와 같음)'?'':s}"${L.site===s?' selected':''}>${s}</option>`).join('')}</select></div>
       </div>`;
    box.appendChild(el);
  });

  box.querySelectorAll('input,select').forEach(f => {
    const i = +f.dataset.i, k = f.dataset.k;
    f.oninput = () => {
      lines[i][k] = f.value.replace(/[^0-9]/g,'') || (k==='w'||k==='gross'||k==='tare' ? '' : f.value);
      if(k!=='w' && k!=='gross' && k!=='tare') lines[i][k] = f.value;
      if(k==='w' || k==='gross' || k==='tare') f.value = lines[i][k];
      grow();
      if(k==='gross' || k==='tare') autoNet(i);
      tally();
      if(k==='gross' || k==='tare' || k==='w') redrawCheck(i);
    };
    f.onchange = () => { if(f.tagName==='SELECT'){ lines[i][k]=f.value; } };
  });
  box.querySelectorAll('.wdel').forEach(b => b.onclick = () => {
    const i = +b.dataset.del;
    lines.splice(i,1);
    if(!lines.length) lines.push(blank());
    drawLines(); tally();
  });
  box.querySelectorAll('.wtoggle').forEach(b => b.onclick = () => {
    const i = +b.dataset.t; lines[i].open = !lines[i].open; drawLines();
  });
  tally();
}

function redrawCheck(i){
  const L = lines[i];
  if(!L.open) return;
  const el = $('lines').children[i];
  const old = el.querySelector('.chk');
  const g = L.gross!=='' ? Number(L.gross) : null;
  const t = L.tare!==''  ? Number(L.tare)  : null;
  if(g===null || t===null){ if(old) old.remove(); return; }
  const d = Math.abs(g-t);
  const ok = L.w!=='' && Number(L.w) === d;
  const html = `큰 값 − 작은 값 = ${d.toLocaleString('ko-KR')} kg${L.w===''?' (아래에 넣습니다)':(ok?'  맞음':'  실중량과 다릅니다')}`;
  if(old){ old.className = 'chk ' + (L.w===''?'':(ok?'ok':'bad')); old.textContent = html; }
  else {
    const n = document.createElement('div');
    n.className = 'chk ' + (L.w===''?'':(ok?'ok':'bad'));
    n.textContent = html;
    el.querySelector('.wmore').insertBefore(n, el.querySelectorAll('.pair')[2]);
  }
}

function autoNet(i){
  const L = lines[i];
  if(L.gross==='' || L.tare==='') return;
  const d = Math.abs(Number(L.gross) - Number(L.tare));
  if(L.w === '' && d > 0){
    L.w = String(d);
    const f = $('lines').children[i].querySelector('input[data-k="w"]');
    if(f) f.value = L.w;
    grow();
  }
}

// 마지막 줄에 값이 들어가면 빈 줄을 하나 더 만든다 — 장수를 고를 필요가 없다
function grow(){
  const last = lines[lines.length-1];
  if(last.w !== '' && lines.length < 30){
    lines.push(blank());
    const box = $('lines');
    const keep = document.activeElement;
    const k = keep && keep.dataset ? [keep.dataset.i, keep.dataset.k] : null;
    drawLines();
    if(k){ const f = box.querySelector(`[data-i="${k[0]}"][data-k="${k[1]}"]`); if(f){ f.focus(); const v=f.value; f.value=''; f.value=v; } }
  }
}

function filled(){ return lines.filter(L => L.w !== '' && Number(L.w) > 0); }
function tally(){
  const f = filled();
  const sum = f.reduce((a,L)=>a+Number(L.w),0);
  $('sumTxt').textContent = `전표 ${f.length}장`;
  $('sumKg').textContent = sum.toLocaleString('ko-KR') + ' kg';
  $('save').disabled = f.length === 0;
}

/* ---------- 저장 ---------- */
function say(t, kind){
  const m = $('msg'); m.className = 'msg' + (kind ? ' '+kind : '');
  m.textContent = t; m.style.display = 'block';
  if(kind === 'ok') setTimeout(()=>{ m.style.display='none'; }, 4000);
  window.scrollTo(0,0);
}

$('save').onclick = () => {
  const f = filled();
  if(!f.length) return;
  if(!veh){ say('설정에서 차량을 먼저 고르세요.', 'err'); return; }
  const date = $('date').value;
  if(!date){ say('계근일을 정하세요.', 'err'); return; }

  const bad = f.filter(L => L.gross!=='' && L.tare!=='' && Math.abs(Number(L.gross)-Number(L.tare)) !== Number(L.w));
  if(bad.length && !confirm(`검산이 맞지 않는 줄이 ${bad.length}개 있습니다. 그대로 저장할까요?`)) return;

  const batch = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const job = {
    node, batch, at: Date.now(),
    photo: photos.length ? photos.map(p=>p.b64).join('|') : null,
    photos: photos.map(p => p.b64),
    records: f.map(L => ({
      date, veh,
      seong: L.seong || $('seong').value,
      site:  L.site  || $('site').value,
      weight: Number(L.w),
      gross: L.gross!=='' ? Number(L.gross) : null,
      tare:  L.tare !=='' ? Number(L.tare)  : null,
      batch, at: Date.now()
    }))
  };

  queue.push(job); LS.set('queue', queue);
  photos = []; drawShots();
  lines = [blank()]; drawLines();
  say(`전표 ${job.records.length}장 담았습니다. 보내는 중…`, 'ok');
  flush();
};

async function flush(){
  if(!queue.length){ qInfo(); return; }
  if(!navigator.onLine){ qInfo(); return; }
  const job = queue[0];
  try{
    if(job.photos && job.photos.length){
      const r = await fetch(`${DB}/${job.node}/photos/${job.batch}.json`, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(job.photos.length === 1 ? job.photos[0] : job.photos)
      });
      if(!r.ok) throw new Error('photo ' + r.status);
    }
    for(const rec of job.records){
      const r = await fetch(`${DB}/${job.node}/records.json`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(rec)
      });
      if(!r.ok) throw new Error('record ' + r.status);
    }
    queue.shift(); LS.set('queue', queue);
    say('보냈습니다.', 'ok');
    if(queue.length) return flush();
  }catch(e){
    say('아직 못 보냈습니다. 폰에 담아뒀다가 연결되면 저절로 보냅니다.', 'err');
  }
  qInfo();
}

function qInfo(){
  const n = queue.reduce((a,j)=>a+j.records.length,0);
  $('qInfo').textContent = n ? `${queue.length}묶음 · 전표 ${n}장이 아직 안 갔습니다` : '없음';
}
$('qSend').onclick = () => { go('in'); flush(); };
window.addEventListener('online', flush);
setInterval(() => { if(queue.length && navigator.onLine) flush(); }, 60000);

/* ---------- 시작 ---------- */
fillSelects();
drawVehPick();
applyVeh();
drawNode();
drawLines();
qInfo();
if(!veh) go('set');
if(queue.length) flush();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
