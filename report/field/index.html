<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>현장앱 – 민원·사고예방</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4421ecfa7ea279c190db811c789e450d&libraries=services"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f8fafc;--card:#fff;--card2:#f1f5f9;
  --accent:#f97316;--accent2:#3b82f6;--green:#16a34a;--green2:#22c55e;
  --text:#0f172a;--sub:#64748b;--border:#e2e8f0;
  --red:#dc2626;--yellow:#ca8a04;--yellow2:#eab308;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;}
button{cursor:pointer;border:none;outline:none;font-family:inherit;}

/* ── 헤더 ── */
#hdr{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--accent);
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
#hdr .logo{font-size:14px;font-weight:700;color:#fff;}
#hdr .logo span{color:rgba(255,255,255,.8);font-size:11px;font-weight:400;margin-left:4px;}
#hdr-right{display:flex;gap:8px;align-items:center;}
#office-link{text-decoration:none;font-size:11px;color:#fff;background:rgba(255,255,255,.25);border-radius:6px;padding:4px 8px;font-weight:700;}
#staff-name{font-size:13px;color:#fff;cursor:pointer;background:rgba(255,255,255,.2);padding:4px 8px;border:1px solid rgba(255,255,255,.4);border-radius:6px;}

/* ── 탭 ── */
#tabs{
  position:fixed;top:46px;left:0;right:0;z-index:99;
  display:flex;background:#fff;border-bottom:2px solid var(--border);
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.tab{flex:1;padding:11px 0;text-align:center;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s;}
.tab.on{color:var(--accent);border-bottom:2.5px solid var(--accent);}

/* ── 메인 ── */
#main{padding-top:86px;padding-bottom:20px;min-height:100%;}
.page{display:none;padding:12px;}
.page.on{display:block;}

/* ── 카드 ── */
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06);}

/* ── 폼 (업데이트용) ── */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px;}
.field input,.field select,.field textarea{
  width:100%;background:#fff;border:1.5px solid var(--border);
  border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;
}
.field textarea{min-height:70px;resize:vertical;}
.field select{appearance:auto;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;}

/* ── 사진 ── */
.photo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.photo-box{
  background:var(--card2);border:2px dashed var(--border);
  border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;cursor:pointer;overflow:hidden;position:relative;
}
.photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px;}
.photo-box .ico{font-size:24px;}
.photo-box .lbl{font-size:11px;color:var(--sub);}
.photo-box input[type=file]{display:none;}

/* ── 버튼 ── */
.btn-primary{
  width:100%;padding:14px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;border-radius:10px;margin-top:4px;
}
.btn-primary:active{opacity:.85;}
.btn-sm{
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:var(--card2);border:1.5px solid var(--border);color:var(--text);
}
.btn-blue{background:#dbeafe;border-color:var(--accent2);color:#1e40af;}

/* ── 목록 ── */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
.filter-bar::-webkit-scrollbar{display:none;}
.fbtn{
  flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;
  background:#fff;border:1.5px solid var(--border);color:var(--sub);cursor:pointer;
}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}

.rec-item{
  background:#fff;border:1px solid var(--border);
  border-left:4px solid var(--border);
  border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.1s;
}
.rec-item:active{opacity:.8;}
.rec-item.life{border-left-color:var(--green2);}
.rec-item.food{border-left-color:var(--yellow2);}
.rec-item.recycle{border-left-color:var(--accent2);}
.rec-item.accident{border-left-color:var(--red);}

.rec-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.rec-num{font-size:11px;color:var(--sub);font-weight:600;}
.rec-type{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
.type-민원{background:#dbeafe;color:#1e40af;}
.type-사고{background:#fee2e2;color:#dc2626;}
.rec-addr{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--text);}
.rec-desc{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:4px;flex-wrap:wrap;}
.status-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
.s-접수{background:#dbeafe;color:#1e40af;}
.s-처리중{background:#fef9c3;color:#a16207;}
.s-완료,.s-처리완료{background:#dcfce7;color:#16a34a;}
.s-보류{background:#f1f5f9;color:var(--sub);}
.risk-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
.r-High{background:#fee2e2;color:#dc2626;}
.r-Medium{background:#fef9c3;color:#a16207;}
.r-Low{background:#f1f5f9;color:var(--sub);}
.waste-tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:8px;}
.waste-생활{background:#dcfce7;color:var(--green);}
.waste-음식물{background:#fef9c3;color:var(--yellow);}
.waste-재활용{background:#dbeafe;color:#1d4ed8;}
.rec-date{font-size:11px;color:var(--sub);}

/* ── 모달 ── */
#modal-bg{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.45);
  overflow-y:auto;
}
#modal-bg.on{display:block;}
#modal{
  background:#fff;border-radius:20px 20px 0 0;
  position:absolute;bottom:0;left:0;right:0;max-height:92vh;overflow-y:auto;
  padding:16px;padding-bottom:32px;
}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-size:15px;font-weight:800;margin-bottom:14px;color:var(--text);}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.detail-row:last-child{border-bottom:none;}
.detail-key{font-size:12px;font-weight:700;color:var(--sub);flex-shrink:0;margin-right:10px;}
.detail-val{font-size:13px;text-align:right;word-break:break-all;color:var(--text);}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.photo-grid img{width:100%;border-radius:8px;cursor:pointer;border:1px solid var(--border);}

/* ── 토스트 ── */
#toast{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;
  font-size:13px;font-weight:600;opacity:0;transition:.3s;white-space:nowrap;z-index:300;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── 로딩/빈상태 ── */
.loading{text-align:center;padding:30px;color:var(--sub);}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:40px 20px;color:var(--sub);}
.empty-ico{font-size:36px;margin-bottom:8px;}
/* ── 지도 ── */
#map-legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border);}
.leg{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--text);}
.leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
#map-container{width:100%;height:calc(100vh - 170px);}
.map-pin{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.3);cursor:pointer;position:relative;display:inline-block;}
.map-pin::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top-width:5px;border-top-style:solid;}
/* 지도 마커 (원형 배지 + 주소 라벨) */
.mk-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;cursor:pointer;}
.mk-lbl{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;white-space:nowrap;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);border:1.5px solid;line-height:1.45;}
.mk-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35);}
</style>
</head>
<body>

<!-- 헤더 -->
<div id="hdr">
  <div class="logo">📱 현장앱 <span>민원·사고예방</span></div>
  <div id="hdr-right">
    <a id="office-link" href="../">🖥️ 사무실</a>
    <button id="staff-name" onclick="changeStaff()">이름 설정</button>
  </div>
</div>

<!-- 탭 -->
<div id="tabs">
  <div class="tab on" data-tab="list">📋 목록</div>
  <div class="tab" data-tab="map">🗺 지도</div>
  <div class="tab" data-tab="update">🔄 업데이트</div>
</div>

<div id="main">

  <!-- ══ 목록 탭 ══ -->
  <div class="page on" id="tab-list">
    <div class="filter-bar">
      <div class="fbtn on" data-f="전체" onclick="setFilter(this)">전체</div>
      <div class="fbtn" data-f="민원" onclick="setFilter(this)">민원</div>
      <div class="fbtn" data-f="사고예방" onclick="setFilter(this)">사고예방</div>
      <div class="fbtn" data-f="접수" onclick="setFilter(this)">접수</div>
      <div class="fbtn" data-f="처리중" onclick="setFilter(this)">처리중</div>
      <div class="fbtn" data-f="완료" onclick="setFilter(this)">완료</div>
      <div class="fbtn" data-f="High" onclick="setFilter(this)">🔴 High</div>
    </div>
    <div id="rec-list"><div class="loading"><div class="spinner"></div><br>불러오는 중...</div></div>
  </div>

  <!-- ══ 지도 탭 ══ -->
  <div class="page" id="tab-map" style="padding:0;">
    <div id="map-legend">
      <div class="leg"><div class="leg-dot" style="background:#22c55e"></div>생활</div>
      <div class="leg"><div class="leg-dot" style="background:#eab308"></div>음식물</div>
      <div class="leg"><div class="leg-dot" style="background:#3b82f6"></div>재활용</div>
      <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>사고High</div>
      <div class="leg"><div class="leg-dot" style="background:#eab308"></div>사고Mid</div>
      <div class="leg"><div class="leg-dot" style="background:#94a3b8"></div>사고Low</div>
    </div>
    <div id="map-container"></div>
  </div>

  <!-- ══ 업데이트 탭 ══ -->
  <div class="page" id="tab-update">
    <div class="card" style="text-align:center;color:var(--sub);font-size:13px;">
      <div style="font-size:32px;margin-bottom:8px;">📋</div>
      <p style="margin-bottom:6px;font-weight:600;color:var(--text);">목록에서 항목을 선택하세요</p>
      <p style="font-size:12px;">목록 탭 → 항목 선택 → <strong style="color:var(--accent)">현장 업데이트</strong> 버튼</p>
    </div>
    <div id="update-area"></div>
  </div>

</div>

<!-- 모달 -->
<div id="modal-bg" onclick="closeMBg(event)">
  <div id="modal">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const FB={
  apiKey:'AIzaSyCrJaARREMDXFfhicjUwWFyqkyTbVMRsYk',
  authDomain:'minwon-c29c2.firebaseapp.com',
  databaseURL:'https://minwon-c29c2-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'minwon-c29c2',
  storageBucket:'minwon-c29c2.firebasestorage.app',
  messagingSenderId:'410383379202',
  appId:'1:410383379202:web:b5dd661f83df18530ff01b'
};
firebase.initializeApp(FB);
const db=firebase.database();
const RECS=db.ref('report/recs');
const PHOTOS=db.ref('report/photos');

let staff=localStorage.getItem('rp_field_staff')||'';
let allRecs=[];
let curFilter='전체';
let updateTarget=null;
let updateTmpPhoto={};

function nowStr(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg,ms=2000){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),ms);
}
function triggerPhoto(id){document.getElementById(id).click();}

/* ── 직원 이름 ── */
function initStaff(){
  if(!staff){staff=prompt('이름을 입력하세요')||'현장직원';}
  localStorage.setItem('rp_field_staff',staff);
  document.getElementById('staff-name').textContent=staff;
}
function changeStaff(){
  const n=prompt('이름 변경',staff);
  if(n){staff=n.trim();localStorage.setItem('rp_field_staff',staff);document.getElementById('staff-name').textContent=staff;}
}

/* ── 탭 ── */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('tab-'+t.dataset.tab).classList.add('on');
    if(t.dataset.tab==='list') renderList();
    if(t.dataset.tab==='map') setTimeout(initFieldMap,80);
  });
});

/* ── 필터 ── */
function setFilter(el){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  curFilter=el.dataset.f;
  renderList();
}

/* ── 목록 렌더 ── */
function renderList(){
  const list=document.getElementById('rec-list');
  let recs=allRecs.filter(r=>!r.del);

  const isHazard=r=>(r.type==='사고예방')||(r.recType==='hazard');

  if(curFilter==='민원') recs=recs.filter(r=>!isHazard(r));
  else if(curFilter==='사고예방') recs=recs.filter(r=>isHazard(r));
  else if(['접수','처리중','완료','보류'].includes(curFilter)) recs=recs.filter(r=>r.status===curFilter);
  else if(['High','Medium','Low'].includes(curFilter)) recs=recs.filter(r=>(r.risk||r.riskLevel)===curFilter);

  recs.sort((a,b)=>{
    const da=a.regAt||a.createdAt||'';
    const db2=b.regAt||b.createdAt||'';
    return db2>da?1:-1;
  });

  if(!recs.length){
    list.innerHTML=`<div class="empty"><div class="empty-ico">📭</div>해당 항목 없음</div>`;
    return;
  }

  list.innerHTML=recs.map(r=>{
    const isH=isHazard(r);
    const waste=r.waste||r.subtype||'';
    const wasteClass=waste==='음식물'?'food':waste==='생활'?'life':waste==='재활용'?'recycle':'';
    const itemClass=isH?'accident':wasteClass;
    const typeLabel=isH?'사고예방':'민원';
    const typeClass=isH?'type-사고':'type-민원';
    const status=r.status||'접수';
    const addr=r.addr||'-';
    const num=r.num||r.no||r.hazardNo||r.id.slice(0,8);
    const date=(r.regAt||r.createdAt||'').slice(5,16);
    const desc=isH
      ?(r.factor||r.riskType||'')+(r.detail||r.riskContent?' | '+(r.detail||r.riskContent):'')
      :(waste?waste+' · ':'')+(r.mtype||r.category||'')+(r.detail||r.content?' | '+(r.detail||r.content):'');
    const wasteEmoji=waste==='음식물'?'🟡':waste==='생활'?'🟢':waste==='재활용'?'🔵':'';

    return `<div class="rec-item ${itemClass}" onclick="openDetail('${r.id}')">
      <div class="rec-top">
        <span class="rec-num">${num}</span>
        <span class="rec-type ${typeClass}">${typeLabel}</span>
      </div>
      <div class="rec-addr">${addr}</div>
      <div class="rec-desc">${desc}</div>
      <div class="rec-footer">
        <span class="status-badge s-${status}">${status}</span>
        ${r.risk||r.riskLevel?`<span class="risk-badge r-${r.risk||r.riskLevel}">${r.risk||r.riskLevel}</span>`:''}
        ${waste&&!isH?`<span class="waste-tag waste-${waste}">${wasteEmoji} ${waste}</span>`:''}
        <span class="rec-date">${date}</span>
      </div>
    </div>`;
  }).join('');
}

/* ── 상세 모달 ── */
function openDetail(id){
  const r=allRecs.find(x=>x.id===id);
  if(!r)return;
  const isH=(r.type==='사고예방')||(r.recType==='hazard');
  const waste=r.waste||r.subtype||'';

  let rows=[];
  if(isH){
    rows=[
      ['번호',r.num||r.hazardNo||'-'],
      ['접수일',r.regAt||r.createdAt||'-'],
      ['담당',r.staff||'-'],
      ['행정동',r.dong||'-'],
      ['주소',r.addr||'-'],
      ['위험등급',`<span class="risk-badge r-${r.risk||r.riskLevel}">${r.risk||r.riskLevel||'-'}</span>`],
      ['위험요인',r.factor||r.riskType||'-'],
      ['내용',r.detail||r.riskContent||'-'],
      ['조치사항',r.action||'-'],
      ['점검결과',r.inspResult||'-'],
      ['상태',`<span class="status-badge s-${r.status||'접수'}">${r.status||'접수'}</span>`],
    ];
  } else {
    const wTag=waste?`<span class="waste-tag waste-${waste}">${waste==='음식물'?'🟡':waste==='생활'?'🟢':'🔵'} ${waste}</span>`:'';
    rows=[
      ['번호',r.num||r.no||'-'],
      ['접수일',r.regAt||r.date||'-'],
      ['담당',r.staff||'-'],
      ['구분',wTag||'-'],
      ['주소',r.addr||'-'],
      ['민원인',`${r.cname||r.person||'-'} ${(r.ctel||r.tel)?'('+(r.ctel||r.tel)+')':''}`],
      ['내용구분',r.mtype||r.category||'-'],
      ['내용',r.detail||r.content||'-'],
      ['확인결과',r.visitResult||r.inspResult||'-'],
      ['조치내용',r.actionNote||r.action||'-'],
      ['상태',`<span class="status-badge s-${r.status||'접수'}">${r.status||'접수'}</span>`],
    ];
  }

  const mc=document.getElementById('modal-content');
  mc.innerHTML=`
    <div class="modal-title">${isH?'⚠️ 사고예방':'📋 민원'} – ${r.num||r.no||r.hazardNo||r.id.slice(0,8)}</div>
    ${rows.map(([k,v])=>`<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v||'-'}</span></div>`).join('')}
    <div id="photo-area-${id}" style="margin-top:12px;"><div class="loading"><div class="spinner"></div></div></div>
    <div style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn-sm btn-blue" style="flex:1" onclick="openFieldUpdate('${id}')">🔄 현장 업데이트</button>
      <button class="btn-sm" style="flex:1" onclick="closeModal()">닫기</button>
    </div>
  `;
  openModal();
  loadPhotos(id,isH);
}

function loadPhotos(id,isH){
  const area=document.getElementById(`photo-area-${id}`);
  if(!area)return;
  PHOTOS.child(id).once('value',snap=>{
    const p=snap.val()||{};
    if(!p.before&&!p.after&&!p.hazard){
      p.before=localStorage.getItem('rp_b_'+id);
      p.after=localStorage.getItem('rp_a_'+id);
      p.hazard=localStorage.getItem('rp_h_'+id);
    }
    const keys=isH?['hazard','after']:['before','after'];
    const lbls={before:'접수 전',after:'처리 후',hazard:'위험 현장'};
    const photos=keys.filter(k=>p[k]);
    if(!photos.length){area.innerHTML='<p style="font-size:12px;color:var(--sub);padding:8px 0;">사진 없음</p>';return;}
    area.innerHTML=`<div class="photo-grid">${photos.map(k=>`
      <div>
        <p style="font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px;">${lbls[k]}</p>
        <img src="${p[k]}" onclick="window.open(this.src)" title="클릭하면 크게 보기">
      </div>`).join('')}</div>`;
  });
}

      ${isH?`

        <label>조치 사항</label>
        <textarea id="u-action" placeholder="조치 사항 입력">${r.action||''}</textarea>
      </div>
      `:`
      <div class="field">
        <label>방문 확인 결과</label>
        <textarea id="u-result" placeholder="방문 확인 결과 입력">${r.visitResult||r.inspResult||''}</textarea>
      </div>

          <option ${r.status==='접수'?'selected':''}>접수</option>

function compressPhoto(file,maxPx=640,q=0.55){
  return new Promise(res=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,maxPx/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=img.width*sc;cv.height=img.height*sc;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',q));
    };
    img.src=url;
  });
}

async function onUpdatePhoto(input,prevId,field){
  if(!input.files[0])return;
  const data=await compressPhoto(input.files[0]);
  updateTmpPhoto[field]=data;
  const prev=document.getElementById(prevId);
  if(prev){prev.src=data;prev.style.display='block';}
}

async function saveFieldUpdate(){
  if(!updateTarget){toast('업데이트 대상이 없습니다');return;}
  const id=updateTarget.id;
  try{
    const updates={
      status:document.getElementById('u-status').value,
      visitResult:document.getElementById('u-result')?document.getElementById('u-result').value.trim():'',
      updatedAt:nowStr(),
      updatedBy:staff
    };
    const isH=(updateTarget.type==='사고예방')||(updateTarget.recType==='hazard');
    if(isH){
      const ua=document.getElementById('u-action');
      if(ua) updates.action=ua.value.trim();
    }
    await RECS.child(id).update(updates);

    for(const [field,data] of Object.entries(updateTmpPhoto)){
      await PHOTOS.child(id).child(field).set(data);
    }

    toast('✅ 저장 완료!',2000);
    clearUpdateArea();

    const idx=allRecs.findIndex(r=>r.id===id);
    if(idx>=0) allRecs[idx]={...allRecs[idx],...updates};
  }catch(e){
    toast('저장 실패: '+e.message,3000);
  }
}

function clearUpdateArea(){
  updateTarget=null;updateTmpPhoto={};
  document.getElementById('update-area').innerHTML=`
    <div class="card" style="text-align:center;color:var(--sub);font-size:13px;">
      <div style="font-size:32px;margin-bottom:8px;">📋</div>
      <p style="margin-bottom:6px;font-weight:600;color:var(--text);">목록에서 항목을 선택하세요</p>

}

const FIXED_LOCS=[
  {name:'레이크팰리스', dong:'잠실동', lat:37.5083, lng:127.0899},
  {name:'트리지움',     dong:'잠실동', lat:37.5095, lng:127.0855},

];
let fieldMap=null, fieldMapInited=false, fieldPins=[], fixedPins=[];

function fieldPinColor(r){
  const isH=(r.type==='사고예방')||(r.recType==='hazard');
  if(isH) return (r.risk||r.riskLevel)==='High'?'#ef4444':(r.risk||r.riskLevel)==='Medium'?'#eab308':'#94a3b8';
  const w=r.waste||r.subtype||'';
  return w==='생활'?'#22c55e':w==='음식물'?'#eab308':'#3b82f6';
}
// 라벨용 진한 색 (흰 배경 위 가독성)
function fieldPinColorDark(r){
  const isH=(r.type==='사고예방')||(r.recType==='hazard');
  if(isH) return (r.risk||r.riskLevel)==='High'?'#dc2626':(r.risk||r.riskLevel)==='Medium'?'#ca8a04':'#64748b';
  const w=r.waste||r.subtype||'';
  return w==='생활'?'#16a34a':w==='음식물'?'#ca8a04':'#2563eb';
}
// 배지 안 2글자
function fieldPinBadge(r){
  const isH=(r.type==='사고예방')||(r.recType==='hazard');
  if(isH) return '사고';
  const w=r.waste||r.subtype||'';
  return w==='생활'?'생활':w==='음식물'?'음식':'재활';
}
function mkEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function mkAddr(r){const a=String(r.addr||'').trim();return mkEsc(a.length>13?a.slice(0,13)+'…':(a||'주소없음'));}
function fieldPinLabel(r){
  const isH=(r.type==='사고예방')||(r.recType==='hazard');
  if(isH) return r.factor||r.riskType||'위험';
  const w=r.waste||r.subtype||'';
  return w||'민원';
}

function initFieldMap(){
  if(fieldMapInited){renderFieldMap();return;}
  fieldMap=new kakao.maps.Map(document.getElementById('map-container'),{
    center:new kakao.maps.LatLng(37.504,127.090),level:5
  });
  fieldMapInited=true;
  initFixedPins();
  renderFieldMap();
}

function initFixedPins(){}

function renderFieldMap(){
  if(!fieldMap)return;
  fieldPins.forEach(p=>p.setMap(null)); fieldPins=[];
  allRecs.filter(r=>!r.del&&r.addrPos).forEach(r=>{
    const c=fieldPinColor(r);
    const lbl=fieldPinLabel(r);
    const ov=new kakao.maps.CustomOverlay({
      position:new kakao.maps.LatLng(r.addrPos.lat,r.addrPos.lng),
      content:`<div class="mk-wrap" onclick="openDetail('${r.id}')"><span class="mk-lbl" style="border-color:${fieldPinColorDark(r)};color:${fieldPinColorDark(r)}">${mkAddr(r)}</span><span class="mk-badge" style="background:${c}">${fieldPinBadge(r)}</span></div>`,
      yAnchor:0.5,zIndex:2
    });
    ov.setMap(fieldMap); fieldPins.push(ov);
  });
}
