<script>

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lvl=n=>n>=6?'높음':(n>=3?'보통':'낮음');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowStr=()=>{const d=new Date();return today()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtD=s=>s?s.replace(/^(\d{4})-(\d{2})-(\d{2}).*/,'$1.$2.$3'):'';

const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- Firebase REST ---------- */
async function api(method,path,body){
  const r=await fetch(`${DB}/${ROOT}/${path}.json`,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error('서버 '+r.status);
  return r.json();
}
const get=p=>api('GET',p), put=(p,v)=>api('PUT',p,v), patch=(p,v)=>api('PATCH',p,v), post=(p,v)=>api('POST',p,v), del=p=>api('DELETE',p);
async function log(what){try{await post('log',{t:nowStr(),u:S.user||'',what})}catch(e){}}

/* ---------- state ---------- */
const S={user:lsGet('risk_user',''),tab:'home',stack:[],cache:{},photoCache:{}};
function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2200)}
function setHead(t,sub){$('#title').textContent=t;$('#subtitle').textContent=sub||'본에코(주) · 위험성평가';$('#backBtn').style.display=S.stack.length?'flex':'none';$('#userName').textContent=S.user||'이름 설정'}
const NAV=[['home','홈','<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>'],['check','점검','<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 12 2 2 4-4"/>'],['report','신고','<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'],['kras','평가','<path d="M4 20h16"/><rect x="5" y="12" width="3" height="6"/><rect x="10.5" y="8" width="3" height="10"/><rect x="16" y="4" width="3" height="14"/>'],['rec','기록','<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9"/><path d="M10 13h4"/>']];
function drawNav(){$('#nav').innerHTML=NAV.map(([k,l,svg])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${svg}</svg>${l}</button>`).join('')}
function go(view,arg,push=true){if(push&&S.cur)S.stack.push(S.cur);S.cur={view,arg};render()}
function back(){const p=S.stack.pop();if(p){S.cur=p;render()}}
function tab(t){S.tab=t;S.stack=[];S.cur={view:t};drawNav();render()}
async function render(){const {view,arg}=S.cur;window.scrollTo(0,0);const m=$('#main');try{await (V[view])(m,arg)}catch(e){console.error(e);m.innerHTML=`<div class="card"><div class="warn">불러오기 실패: ${esc(e.message)}</div><p class="muted">인터넷 연결을 확인하고 다시 시도해 주세요.</p><button class="btn block" data-act="retry">다시 시도</button></div>`}}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-tab]');if(n){tab(n.dataset.tab);return}
  const b=e.target.closest('[data-go]');if(b){go(b.dataset.go,b.dataset.arg);return}
  const ph=e.target.closest('[data-photo]');if(ph&&!e.target.closest('.x')){openPhoto(ph.dataset.photo,ph.dataset.cap,ph.dataset.list);return}
  if(e.target.closest('[data-act="retry"]'))render();
});
$('#backBtn').onclick=back;
$('#userBtn').onclick=askUser;
function askUser(){const n=prompt('이름을 입력하세요 (기록·서명에 남습니다)',S.user||'');if(n!=null&&n.trim()){S.user=n.trim();lsSet('risk_user',S.user);setHead($('#title').textContent,$('#subtitle').textContent)}}
function needUser(){if(!S.user)askUser();return !!S.user}

/* ---------- photos ---------- */
async function photoSrc(id){
  if(S.photoCache[id])return S.photoCache[id];
  const path=id.startsWith('p')&&id.length===3?`archive/2026/photos/${id}`:`photos/${id}`;
  const v=await get(path);if(v)S.photoCache[id]=v;return v;
}
function thumbs(ids,opts={}){
  if(!ids||!ids.length)return '';
  const list=ids.join(',');
  return `<div class="thumbs">${ids.map(id=>{const cap=opts.cap?(A.photos[id]||{}).cap||'':'';return `<button class="ph" data-photo="${id}" data-cap="${esc(cap)}" data-list="${list}"><div class="ph-empty" data-ph="${id}">불러오는 중</div>${cap?`<span class="cap">${esc(cap)}</span>`:''}${opts.del?`<span class="x" data-delph="${id}">×</span>`:''}</button>`}).join('')}</div>`;
}
async function fillThumbs(root){
  for(const el of root.querySelectorAll('[data-ph]')){
    const id=el.dataset.ph;
    photoSrc(id).then(src=>{if(src)el.outerHTML=`<img src="${src}" alt="">`;else el.textContent='사진 미등록'}).catch(()=>{el.textContent='연결 안 됨'});
  }
}
async function openPhoto(id,cap,list){
  const ids=(list||id).split(',');let i=ids.indexOf(id);
  const lb=document.createElement('div');lb.className='lightbox';
  const draw=async()=>{const pid=ids[i];const c=cap&&ids.length===1?cap:((A.photos[pid]||{}).cap||'');lb.innerHTML=`<div class="bar"><span>${esc(c)} <span style="color:#999">${i+1}/${ids.length}</span></span><button class="btn sm" data-x>닫기</button></div><img alt="" src=""><div class="bar"><button class="btn sm" data-p ${i?'':'disabled'}>◀ 이전</button><button class="btn sm" data-n ${i<ids.length-1?'':'disabled'}>다음 ▶</button></div>`;
    const src=await photoSrc(pid).catch(()=>null);const im=lb.querySelector('img');if(src)im.src=src;else im.alt='사진 미등록'};
  lb.onclick=e=>{if(e.target.closest('[data-x]'))lb.remove();else if(e.target.closest('[data-p]')&&i>0){i--;draw()}else if(e.target.closest('[data-n]')&&i<ids.length-1){i++;draw()}};
  document.body.appendChild(lb);draw();
}
function compress(file,max=1280,q=0.7){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
// photo picker bound to an array
function photoPicker(holder,arr){
  const draw=()=>{holder.innerHTML=`<div class="thumbs">${arr.map((d,k)=>`<div class="ph"><img src="${d}" alt=""><span class="x" data-rm="${k}">×</span></div>`).join('')}</div><label class="btn block" style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;border-style:dashed"><input type="file" accept="image/*" multiple hidden>📷 사진 추가</label>`;
    holder.querySelector('input').onchange=async e=>{for(const f of e.target.files){try{arr.push(await compress(f))}catch(_){toast('사진을 읽지 못했습니다')}}draw()};
    holder.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{arr.splice(+x.dataset.rm,1);draw()})};

function sigModal(done){
  const md=document.createElement('div');md.className='modal';
  md.innerHTML=`<div class="sheet"><h2 style="margin:0 0 8px">참석자 서명</h2><div class="grid2"><div><label class="f" for="sn" style="margin-top:0">이름</label><input class="i" id="sn"></div><div><label class="f" for="st" style="margin-top:0">팀</label><select class="i" id="st">${TEAMS.map(t=>`<option>${t}</option>`).join('')}</select></div></div><label class="f">여기에 손가락으로 서명</label><canvas class="sig"></canvas><div class="grid3" style="margin-top:10px"><button class="btn" data-c>취소</button><button class="btn" data-r>다시 쓰기</button><button class="btn pri" data-o>서명 완료</button></div></div>`;
  document.body.appendChild(md);const cv=md.querySelector('canvas');const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);c.lineWidth=2.5;c.lineCap='round';c.strokeStyle='#111';let dr=false,any=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{dr=true;any=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);c.beginPath();c.moveTo(x,y)};
  cv.onpointermove=e=>{if(!dr)return;const [x,y]=pt(e);c.lineTo(x,y);c.stroke()};
  cv.onpointerup=()=>dr=false;
  md.querySelector('#sn').focus();
  md.onclick=e=>{if(e.target.closest('[data-c]'))md.remove();else if(e.target.closest('[data-r]')){c.clearRect(0,0,cv.width,cv.height);any=false}else if(e.target.closest('[data-o]')){const n=md.querySelector('#sn').value.trim();if(!n){toast('이름을 적어 주세요');return}if(!any){toast('서명해 주세요');return}
    const sm=document.createElement('canvas');sm.width=240;sm.height=Math.round(240*cv.height/cv.width);const sc=sm.getContext('2d');sc.fillStyle='#fff';sc.fillRect(0,0,sm.width,sm.height);sc.drawImage(cv,0,0,sm.width,sm.height);
    done({name:n,team:md.querySelector('#st').value,sig:sm.toDataURL('image/png'),t:nowStr()});md.remove()}};
}

function doPrint(html,landscape){const p=$('#print');p.innerHTML=html;let st=document.getElementById('pgst');if(!st){st=document.createElement('style');st.id='pgst';document.head.appendChild(st)}st.textContent=landscape?'@page{size:A4 landscape;margin:10mm}':'@page{size:A4;margin:12mm}';setTimeout(()=>window.print(),300)}
const pb=t=>esc(t||'').replace(/\s*⦁\s*/g,'<br>· ').replace(/^<br>/,'');
function printKras(year,rows){
  const byP={};rows.forEach(r=>(byP[r.proc]=byP[r.proc]||[]).push(r));
  const head=year===2026?`평가일시 2026.05.11 ~ 05.14`:'';
  let h=`<h1>${A.company} ${year}년 위험성평가 (KRAS 표준 양식)</h1><div>${head}</div>`;
  for(const [k] of PROC){const R=byP[k];if(!R)continue;
    h+=`<h2>작업공정명: ${PROCN[k]}</h2><table><thead><tr><th>세부작업</th><th>위험분류</th><th style="width:20%">위험 발생 상황 및 결과</th><th>관련 근거</th><th style="width:14%">현재의 안전보건 조치</th><th>가능성</th><th>중대성</th><th>위험성</th><th style="width:18%">위험성 감소대책</th><th>개선후</th><th>예정일</th><th>완료일</th><th>담당자</th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(r.task)}</td><td>${esc(r.cls)}</td><td>${esc(r.hazard)}</td><td>${esc(r.law)}</td><td>${pb(r.current)}</td><td>${r.p}</td><td>${r.s}</td><td>${r.risk}<br>(${lvl(r.risk)})</td><td>${pb(r.plan)}</td><td>${r.after||''}${r.after?'<br>('+lvl(r.after)+')':''}</td><td>${fmtD(r.due)}</td><td>${fmtD(r.done)}${r.dateNote?'<br>'+esc(r.dateNote):''}</td><td>${esc(r.owner)}</td></tr>`).join('')}</tbody></table>`}
  doPrint(h,true);
}
function printCheck(L,s){let last='';doPrint(`<h1>유해·위험요인 파악 체크리스트 — ${esc(L.name)}</h1><div>점검일 ${fmtD(s.date)} · 점검자 ${esc(s.by)}</div><table style="margin-top:8px"><thead><tr><th>번호</th><th>구분</th><th>유해·위험요인(점검항목)</th><th>결과</th><th>비고</th></tr></thead><tbody>${L.items.map(it=>{const r=(s.res||{})[it.id]||{};return `<tr><td>${esc(it.no)}</td><td>${it.cat!==last?esc(last=it.cat):''}</td><td>${esc(it.text)}</td><td>${esc(r.r==='적합'?'√':(r.r||''))}</td><td>${esc(r.note||'')}</td></tr>`}).join('')}</tbody></table>`)}
async function printEdu(){let h=`<h1>${A.company} 2026년 위험성평가 관련 교육 기록</h1>`;for(const e of A.education){h+=`<h2>${fmtD(e.date)} ${esc(e.time)} · ${esc(e.title)} (${esc(e.team)})</h2><div>장소: ${esc(e.place||'-')}</div>${e.items.map(i=>`<div>● ${esc(i)}</div>`).join('')}<div>${(await Promise.all(e.photos.slice(0,2).map(id=>photoSrc(id).catch(()=>null)))).filter(Boolean).map(s=>`<span class="ph"><img src="${s}"></span>`).join('')}</div>`}doPrint(h)}
async function printEduOne(x){const ph=(await Promise.all((x.photos||[]).slice(0,4).map(id=>photoSrc(id).catch(()=>null)))).filter(Boolean);
  doPrint(`<h1 style="text-align:center">교 육 실 행 서</h1><table><tr><th style="width:20%">구분</th><td>${esc(x.kind)}</td></tr><tr><th>교육일시</th><td>${fmtD(x.date)} ${esc(x.time||'')}</td></tr><tr><th>교육장소</th><td>${esc(x.place||'')}</td></tr><tr><th>교육자</th><td>${esc(x.by||'')}</td></tr><tr><th>교육내용</th><td style="white-space:pre-line">${esc(x.content||x.title)}${x.shared?'\n● 위험성평가 결과 공유':''}</td></tr></table><h2>교육 사진</h2>${ph.map(s=>`<span class="ph"><img src="${s}"></span>`).join('')}<h2>참석자 서명 (${(x.att||[]).length}명)</h2><table><thead><tr><th>번호</th><th>성명</th><th>팀</th><th>서명</th></tr></thead><tbody>${(x.att||[]).map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.name)}</td><td>${esc(a.team||'')}</td><td><img src="${a.sig}" style="height:28px"></td></tr>`).join('')}</tbody></table>`)}
